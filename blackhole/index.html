<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gargantua - Interstellar Black Hole</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(255,150,50,0.5);
            z-index: 100;
            pointer-events: none;
        }
        #info h1 { font-size: 24px; color: #ffaa44; margin-bottom: 10px; }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #888;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            z-index: 100;
        }
        #controls label { margin-right: 20px; }
        #debug {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>GARGANTUA</h1>
        <div>Drag to rotate | Scroll to zoom</div>
    </div>
    <div id="controls">
        <label>Brightness: <input type="range" id="brightness" min="0.5" max="5" step="0.1" value="2.0"></label>
        <label>Lensing: <input type="range" id="lensing" min="0.3" max="2" step="0.1" value="1.0"></label>
    </div>
    <div id="debug">Loading...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        console.log('=== Gargantua Black Hole v6.0 ===');
        
        let scene, camera, renderer, material;
        let rotX = 0.25, rotY = 0;
        let targetRotX = 0.25, targetRotY = 0;
        let zoom = 10;
        let isDragging = false, lastX, lastY;
        
        init();
        
        function init() {
            console.log('Initializing...');
            
            scene = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);
            
            const vertexShader = `
                void main() {
                    gl_Position = vec4(position, 1.0);
                }
            `;
            
            const fragmentShader = `
                precision highp float;
                
                uniform float uTime;
                uniform vec2 uResolution;
                uniform vec3 uCamPos;
                uniform float uBrightness;
                uniform float uLensing;
                
                #define PI 3.14159265359
                
                // Physical parameters (in Schwarzschild radii)
                #define RS 1.0           // Event horizon radius
                #define PHOTON_SPHERE 1.5  // Photon sphere (where light orbits)
                #define ISCO 3.0         // Innermost stable circular orbit
                #define DISK_INNER 2.6   // Accretion disk inner edge (slightly inside ISCO for visual)
                #define DISK_OUTER 8.0   // Accretion disk outer edge
                
                #define MAX_STEPS 180
                
                float hash(vec2 p) {
                    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
                }
                
                vec3 blackbody(float T) {
                    T = clamp(T, 1000.0, 40000.0) / 100.0;
                    vec3 c;
                    c.r = T <= 66.0 ? 1.0 : 1.292936 * pow(T - 60.0, -0.1332);
                    c.g = T <= 66.0 ? max(0.0, 0.390082 * log(max(1.0, T)) - 0.631841) : 1.129891 * pow(T - 60.0, -0.0755);
                    c.b = T >= 66.0 ? 1.0 : T <= 19.0 ? 0.0 : max(0.0, 0.543207 * log(max(1.0, T - 10.0)) - 0.196564);
                    return clamp(c, 0.0, 1.0);
                }
                
                float noise(vec2 p) {
                    vec2 i = floor(p);
                    vec2 f = fract(p);
                    f = f * f * (3.0 - 2.0 * f);
                    return mix(
                        mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                        mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
                        f.y
                    );
                }
                
                vec3 stars(vec3 rd) {
                    vec3 col = vec3(0.0);
                    float theta = atan(rd.z, rd.x);
                    float phi = acos(rd.y);
                    vec2 uv = vec2(theta / PI, phi / PI);
                    
                    // Large stars
                    vec2 gv = fract(uv * 50.0) - 0.5;
                    vec2 id = floor(uv * 50.0);
                    float n = hash(id);
                    if (n > 0.96) {
                        float d = length(gv);
                        float star = smoothstep(0.25, 0.0, d) * hash(id * 2.0);
                        vec3 starCol = mix(vec3(0.7, 0.8, 1.0), vec3(1.0, 0.9, 0.7), hash(id * 1.5));
                        col += starCol * star;
                    }
                    
                    // Small stars
                    gv = fract(uv * 120.0) - 0.5;
                    id = floor(uv * 120.0);
                    n = hash(id);
                    if (n > 0.97) {
                        float d = length(gv);
                        col += vec3(0.9, 0.95, 1.0) * smoothstep(0.18, 0.0, d) * 0.6;
                    }
                    
                    return col;
                }
                
                void main() {
                    vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y;
                    
                    // Camera setup
                    vec3 ro = uCamPos;
                    vec3 forward = normalize(-ro);
                    vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), forward));
                    vec3 up = cross(forward, right);
                    vec3 rd = normalize(forward + uv.x * right + uv.y * up);
                    vec3 rdOriginal = rd;
                    
                    vec3 col = vec3(0.0);
                    float accum = 0.0;
                    bool hitHorizon = false;
                    
                    // ===== RAY MARCHING =====
                    float t = 0.0;
                    
                    for (int i = 0; i < MAX_STEPS; i++) {
                        vec3 p = ro + rd * t;
                        float r = length(p);
                        
                        // Hit event horizon
                        if (r < RS) {
                            hitHorizon = true;
                            break;
                        }
                        
                        if (r > 30.0) break;
                        
                        // Adaptive step size
                        float stepSize = max(0.02, (r - RS) * 0.025);
                        
                        // Gravitational lensing
                        if (r < 25.0) {
                            vec3 toCenter = -normalize(p);
                            float bend = uLensing * 3.0 * RS * RS / (r * r);
                            rd = normalize(rd + toCenter * bend * stepSize);
                        }
                        
                        // ===== PHOTON SPHERE GLOW =====
                        // Light that passes very close to photon sphere creates a bright ring
                        if (r < PHOTON_SPHERE * 1.3 && r > PHOTON_SPHERE * 0.8) {
                            float sphereDist = abs(r - PHOTON_SPHERE);
                            float glow = exp(-sphereDist * sphereDist * 15.0);
                            glow *= 0.15 * uBrightness;
                            
                            vec3 glowCol = vec3(1.0, 0.85, 0.6); // Warm glow
                            col += glowCol * glow * (1.0 - accum);
                            accum += glow * 0.3;
                        }
                        
                        // ===== ACCRETION DISK =====
                        if (abs(p.y) < 0.3 && r > DISK_INNER && r < DISK_OUTER) {
                            // Height fade
                            float heightFade = 1.0 - abs(p.y) / 0.3;
                            heightFade = pow(heightFade, 2.0);
                            
                            // Radial fade
                            float innerFade = smoothstep(DISK_INNER, DISK_INNER + 0.8, r);
                            float outerFade = 1.0 - smoothstep(DISK_OUTER - 1.0, DISK_OUTER, r);
                            float radialFade = innerFade * outerFade;
                            
                            // Temperature (hotter near center)
                            float temp = 35000.0 * pow(DISK_INNER / r, 0.75);
                            
                            // Doppler beaming
                            vec3 vel = normalize(vec3(-p.z, 0.0, p.x));
                            float vDotR = dot(vel, rd);
                            float doppler = 0.4 + 0.6 * pow(vDotR * 0.5 + 0.5, 1.5);
                            
                            // Turbulence
                            float angle = atan(p.z, p.x);
                            float turbAngle = angle - uTime * 0.25 / max(0.5, r - DISK_INNER);
                            float turb = 0.7 + 0.3 * noise(vec2(r * 4.0, turbAngle * 5.0));
                            
                            // Intensity
                            float intensity = heightFade * radialFade * doppler * turb * uBrightness * 0.08;
                            
                            vec3 diskCol = blackbody(temp) * intensity;
                            
                            float alpha = intensity * (1.0 - accum);
                            col += diskCol * alpha;
                            accum += alpha * 0.12;
                        }
                        
                        t += stepSize;
                    }
                    
                    // ===== STARS =====
                    if (!hitHorizon) {
                        vec3 starCol = stars(rdOriginal);
                        col += starCol * (1.0 - min(1.0, accum * 1.5));
                    }
                    
                    // Tone mapping
                    col = col / (1.0 + col);
                    
                    // Gamma correction
                    col = pow(col, vec3(0.4545));
                    
                    gl_FragColor = vec4(col, 1.0);
                }
            `;
            
            material = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: {
                    uTime: { value: 0.0 },
                    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    uCamPos: { value: new THREE.Vector3(0, 2.5, zoom) },
                    uBrightness: { value: 2.0 },
                    uLensing: { value: 1.0 }
                }
            });
            
            console.log('Material created');
            
            const geometry = new THREE.PlaneGeometry(2, 2);
            scene.add(new THREE.Mesh(geometry, material));
            
            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
            });
            
            document.addEventListener('mousedown', (e) => { 
                isDragging = true; 
                lastX = e.clientX; 
                lastY = e.clientY; 
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                targetRotY += (e.clientX - lastX) * 0.005;
                targetRotX += (e.clientY - lastY) * 0.005;
                targetRotX = Math.max(-1.2, Math.min(1.2, targetRotX));
                lastX = e.clientX;
                lastY = e.clientY;
            });
            
            document.addEventListener('mouseup', () => { isDragging = false; });
            
            document.addEventListener('wheel', (e) => {
                zoom += e.deltaY * 0.01;
                zoom = Math.max(5, Math.min(20, zoom));
            }, { passive: true });
            
            document.getElementById('brightness').addEventListener('input', (e) => {
                material.uniforms.uBrightness.value = parseFloat(e.target.value);
            });
            
            document.getElementById('lensing').addEventListener('input', (e) => {
                material.uniforms.uLensing.value = parseFloat(e.target.value);
            });
            
            console.log('Starting animation...');
            animate();
        }
        
        function updateDebug() {
            const cam = material.uniforms.uCamPos.value;
            document.getElementById('debug').innerHTML = 
                'Camera: (' + cam.x.toFixed(1) + ', ' + cam.y.toFixed(1) + ', ' + cam.z.toFixed(1) + ')<br>' +
                'Zoom: ' + zoom.toFixed(1) + '<br>' +
                'Brightness: ' + material.uniforms.uBrightness.value.toFixed(1);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            material.uniforms.uTime.value += 0.016;
            
            rotX += (targetRotX - rotX) * 0.1;
            rotY += (targetRotY - rotY) * 0.1;
            
            material.uniforms.uCamPos.value.set(
                Math.sin(rotY) * Math.cos(rotX) * zoom,
                Math.sin(rotX) * zoom,
                Math.cos(rotY) * Math.cos(rotX) * zoom
            );
            
            if (Math.floor(material.uniforms.uTime.value * 10) % 10 === 0) updateDebug();
            
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
