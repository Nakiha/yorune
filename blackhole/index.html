<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gargantua - Interstellar Black Hole</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(255,150,50,0.5);
            z-index: 100;
            pointer-events: none;
        }
        #info h1 { font-size: 24px; color: #ffaa44; margin-bottom: 10px; }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #888;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            z-index: 100;
        }
        #controls label { margin-right: 20px; }
        #debug {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>GARGANTUA</h1>
        <div>Drag to rotate | Scroll to zoom</div>
    </div>
    <div id="controls">
        <label>Brightness: <input type="range" id="brightness" min="0.5" max="3" step="0.1" value="1.8"></label>
        <label>Lensing: <input type="range" id="lensing" min="0.5" max="3" step="0.1" value="1.2"></label>
    </div>
    <div id="debug">Loading...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        console.log('=== Gargantua Black Hole v3.0 ===');
        
        let scene, camera, renderer, material;
        let rotX = 0.3, rotY = 0;
        let targetRotX = 0.3, targetRotY = 0;
        let zoom = 12;
        let isDragging = false, lastX, lastY;
        
        init();
        
        function init() {
            console.log('Initializing...');
            
            scene = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);
            console.log('Renderer:', window.innerWidth, 'x', window.innerHeight);
            
            const vertexShader = `
                void main() {
                    gl_Position = vec4(position, 1.0);
                }
            `;
            
            const fragmentShader = `
                precision highp float;
                
                uniform float uTime;
                uniform vec2 uResolution;
                uniform vec3 uCamPos;
                uniform float uBrightness;
                uniform float uLensing;
                
                #define RS 1.0
                #define DISK_INNER 1.5
                #define DISK_OUTER 6.0
                #define MAX_STEPS 150
                
                // Hash function
                float hash(vec2 p) {
                    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
                }
                
                // Temperature to color (blackbody)
                vec3 blackbody(float T) {
                    T = clamp(T, 1000.0, 40000.0) / 100.0;
                    vec3 c;
                    c.r = T <= 66.0 ? 1.0 : 1.292936 * pow(T - 60.0, -0.1332);
                    c.g = T <= 66.0 ? max(0.0, 0.390082 * log(T) - 0.631841) : 1.129891 * pow(T - 60.0, -0.0755);
                    c.b = T >= 66.0 ? 1.0 : T <= 19.0 ? 0.0 : max(0.0, 0.543207 * log(T - 10.0) - 0.196564);
                    return clamp(c, 0.0, 1.0);
                }
                
                // Simple noise
                float noise(vec2 p) {
                    vec2 i = floor(p);
                    vec2 f = fract(p);
                    f = f * f * (3.0 - 2.0 * f);
                    return mix(
                        mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                        mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
                        f.y
                    );
                }
                
                // Star background
                vec3 stars(vec2 uv) {
                    vec3 col = vec3(0.0);
                    
                    // Create stars using hash
                    vec2 gv = fract(uv * 80.0) - 0.5;
                    vec2 id = floor(uv * 80.0);
                    
                    float n = hash(id);
                    
                    if (n > 0.97) {
                        float star = smoothstep(0.3, 0.0, length(gv));
                        star *= n;
                        
                        // Star color variation
                        vec3 starCol = mix(
                            vec3(0.7, 0.8, 1.0),
                            vec3(1.0, 0.9, 0.7),
                            hash(id * 1.5)
                        );
                        
                        col += starCol * star * 0.8;
                    }
                    
                    // Smaller stars
                    gv = fract(uv * 200.0) - 0.5;
                    id = floor(uv * 200.0);
                    n = hash(id);
                    
                    if (n > 0.985) {
                        float star = smoothstep(0.2, 0.0, length(gv));
                        col += vec3(0.9, 0.95, 1.0) * star * 0.5 * n;
                    }
                    
                    return col;
                }
                
                void main() {
                    vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y;
                    
                    // Camera
                    vec3 ro = uCamPos;
                    vec3 lookAt = vec3(0.0);
                    
                    vec3 forward = normalize(lookAt - ro);
                    vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), forward));
                    vec3 up = cross(forward, right);
                    
                    vec3 rd = normalize(forward + uv.x * right + uv.y * up);
                    
                    vec3 col = vec3(0.0);
                    
                    // ========== STAR BACKGROUND ==========
                    // Project ray to sphere for stars
                    vec3 starDir = rd;
                    col += stars(starDir.xy * 2.0 + starDir.z);
                    
                    // ========== RAY MARCHING ==========
                    float t = 0.0;
                    vec3 diskLight = vec3(0.0);
                    
                    for (int i = 0; i < MAX_STEPS; i++) {
                        vec3 p = ro + rd * t;
                        float r = length(p);
                        
                        // Hit event horizon - BLACK
                        if (r < RS) {
                            col = vec3(0.0);
                            diskLight = vec3(0.0);
                            break;
                        }
                        
                        if (r > 25.0) break;
                        
                        float stepSize = max(0.03, (r - RS) * 0.05);
                        
                        // Gravitational lensing
                        if (r < DISK_OUTER * 2.0 && r > RS * 1.1) {
                            vec3 toCenter = -normalize(p);
                            float bend = uLensing * RS * 1.5 / (r * r);
                            rd = normalize(rd + toCenter * bend * stepSize);
                        }
                        
                        // ========== ACCRETION DISK ==========
                        if (abs(p.y) < 0.25 && r > DISK_INNER && r < DISK_OUTER) {
                            float heightFade = 1.0 - abs(p.y) / 0.25;
                            heightFade = pow(heightFade, 1.5);
                            
                            float innerFade = smoothstep(DISK_INNER, DISK_INNER + 0.5, r);
                            float outerFade = 1.0 - smoothstep(DISK_OUTER - 0.5, DISK_OUTER, r);
                            float radialFade = innerFade * outerFade;
                            
                            // Temperature gradient
                            float temp = 30000.0 * pow(DISK_INNER / r, 0.75);
                            
                            // Doppler effect
                            vec3 vel = normalize(vec3(-p.z, 0.0, p.x));
                            float doppler = pow(max(0.0, 0.5 + 0.5 * dot(vel, rd)), 2.0) * 2.0;
                            
                            // Turbulence
                            float angle = atan(p.z, p.x);
                            float turbAngle = angle - uTime * 0.3 / max(0.3, r - DISK_INNER);
                            float turb = noise(vec2(r * 3.0, turbAngle * 4.0)) * 0.5 + 0.5;
                            
                            // Intensity
                            float intensity = heightFade * radialFade * doppler * turb;
                            intensity *= uBrightness * 0.15;
                            
                            // Color
                            vec3 diskCol = blackbody(temp) * intensity;
                            
                            // Accumulate
                            float alpha = intensity * 0.1;
                            diskLight += diskCol * alpha;
                        }
                        
                        t += stepSize;
                    }
                    
                    // Combine disk with stars
                    col += diskLight;
                    
                    // Photon ring glow
                    float screenR = length(uv);
                    float ringGlow = exp(-pow((screenR - 0.12) * 20.0, 2.0)) * 0.3 * uBrightness;
                    col += vec3(1.0, 0.7, 0.4) * ringGlow;
                    
                    // Tone mapping
                    col = col / (1.0 + col);
                    
                    // Gamma
                    col = pow(col, vec3(0.4545));
                    
                    gl_FragColor = vec4(col, 1.0);
                }
            `;
            
            material = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: {
                    uTime: { value: 0.0 },
                    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    uCamPos: { value: new THREE.Vector3(0, 3, zoom) },
                    uBrightness: { value: 1.8 },
                    uLensing: { value: 1.2 }
                }
            });
            
            console.log('Material created');
            
            const geometry = new THREE.PlaneGeometry(2, 2);
            scene.add(new THREE.Mesh(geometry, material));
            
            // Events
            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
            });
            
            document.addEventListener('mousedown', (e) => { 
                isDragging = true; 
                lastX = e.clientX; 
                lastY = e.clientY; 
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                targetRotY += (e.clientX - lastX) * 0.005;
                targetRotX += (e.clientY - lastY) * 0.005;
                targetRotX = Math.max(-1.4, Math.min(1.4, targetRotX));
                lastX = e.clientX;
                lastY = e.clientY;
            });
            
            document.addEventListener('mouseup', () => { isDragging = false; });
            
            document.addEventListener('wheel', (e) => {
                zoom += e.deltaY * 0.01;
                zoom = Math.max(5, Math.min(25, zoom));
            }, { passive: true });
            
            document.getElementById('brightness').addEventListener('input', (e) => {
                material.uniforms.uBrightness.value = parseFloat(e.target.value);
            });
            
            document.getElementById('lensing').addEventListener('input', (e) => {
                material.uniforms.uLensing.value = parseFloat(e.target.value);
            });
            
            console.log('Starting animation...');
            animate();
        }
        
        function updateDebug() {
            const cam = material.uniforms.uCamPos.value;
            document.getElementById('debug').innerHTML = 
                'Camera: (' + cam.x.toFixed(1) + ', ' + cam.y.toFixed(1) + ', ' + cam.z.toFixed(1) + ')<br>' +
                'Zoom: ' + zoom.toFixed(1) + '<br>' +
                'Brightness: ' + material.uniforms.uBrightness.value.toFixed(1);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            material.uniforms.uTime.value += 0.016;
            
            rotX += (targetRotX - rotX) * 0.1;
            rotY += (targetRotY - rotY) * 0.1;
            
            material.uniforms.uCamPos.value.set(
                Math.sin(rotY) * Math.cos(rotX) * zoom,
                Math.sin(rotX) * zoom,
                Math.cos(rotY) * Math.cos(rotX) * zoom
            );
            
            if (Math.floor(material.uniforms.uTime.value * 10) % 10 === 0) updateDebug();
            
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
