<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gargantua - Interstellar Black Hole</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(255,150,50,0.5);
            z-index: 100;
            pointer-events: none;
        }
        #info h1 { font-size: 24px; color: #ffaa44; margin-bottom: 10px; }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #888;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            z-index: 100;
        }
        #controls label { margin-right: 20px; }
        #debug {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>GARGANTUA</h1>
        <div>Drag to rotate | Scroll to zoom</div>
    </div>
    <div id="controls">
        <label>Brightness: <input type="range" id="brightness" min="0.5" max="5" step="0.1" value="2.5"></label>
        <label>Lensing: <input type="range" id="lensing" min="0.3" max="3" step="0.1" value="1.0"></label>
    </div>
    <div id="debug">Loading...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        console.log('=== Gargantua Black Hole v5.0 ===');
        
        let scene, camera, renderer, material;
        let rotX = 0.3, rotY = 0;
        let targetRotX = 0.3, targetRotY = 0;
        let zoom = 10;
        let isDragging = false, lastX, lastY;
        
        init();
        
        function init() {
            console.log('Initializing...');
            
            scene = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);
            
            const vertexShader = `
                void main() {
                    gl_Position = vec4(position, 1.0);
                }
            `;
            
            const fragmentShader = `
                precision highp float;
                
                uniform float uTime;
                uniform vec2 uResolution;
                uniform vec3 uCamPos;
                uniform float uBrightness;
                uniform float uLensing;
                
                #define PI 3.14159265359
                #define RS 1.0
                #define DISK_INNER 1.5
                #define DISK_OUTER 5.0
                #define MAX_STEPS 150
                
                float hash(vec2 p) {
                    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
                }
                
                float hash3(vec3 p) {
                    return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453);
                }
                
                // Blackbody color
                vec3 blackbody(float T) {
                    T = clamp(T, 1000.0, 40000.0) / 100.0;
                    vec3 c;
                    c.r = T <= 66.0 ? 1.0 : 1.292936 * pow(T - 60.0, -0.1332);
                    c.g = T <= 66.0 ? max(0.0, 0.390082 * log(max(1.0, T)) - 0.631841) : 1.129891 * pow(T - 60.0, -0.0755);
                    c.b = T >= 66.0 ? 1.0 : T <= 19.0 ? 0.0 : max(0.0, 0.543207 * log(max(1.0, T - 10.0)) - 0.196564);
                    return clamp(c, 0.0, 1.0);
                }
                
                float noise(vec2 p) {
                    vec2 i = floor(p);
                    vec2 f = fract(p);
                    f = f * f * (3.0 - 2.0 * f);
                    return mix(
                        mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                        mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
                        f.y
                    );
                }
                
                // Star field on sphere
                vec3 stars(vec3 rd) {
                    vec3 col = vec3(0.0);
                    
                    // Convert direction to spherical UV
                    float theta = atan(rd.z, rd.x);
                    float phi = acos(rd.y);
                    vec2 uv = vec2(theta / PI, phi / PI);
                    
                    // Layer 1: Large stars
                    vec2 gv = fract(uv * 40.0) - 0.5;
                    vec2 id = floor(uv * 40.0);
                    float n = hash(id);
                    if (n > 0.965) {
                        float d = length(gv);
                        float brightness = hash(id * 2.0);
                        float star = smoothstep(0.3, 0.0, d) * brightness;
                        vec3 starCol = mix(vec3(0.7, 0.8, 1.0), vec3(1.0, 0.9, 0.7), hash(id * 1.5));
                        col += starCol * star;
                    }
                    
                    // Layer 2: Medium stars
                    gv = fract(uv * 100.0) - 0.5;
                    id = floor(uv * 100.0);
                    n = hash(id);
                    if (n > 0.975) {
                        float d = length(gv);
                        col += vec3(0.9, 0.95, 1.0) * smoothstep(0.2, 0.0, d) * 0.6;
                    }
                    
                    // Layer 3: Tiny stars
                    gv = fract(uv * 200.0) - 0.5;
                    id = floor(uv * 200.0);
                    n = hash(id);
                    if (n > 0.985) {
                        float d = length(gv);
                        col += vec3(1.0) * smoothstep(0.15, 0.0, d) * 0.4;
                    }
                    
                    return col;
                }
                
                // Accretion disk density
                float diskDensity(vec3 p) {
                    float r = length(p.xz);
                    float h = abs(p.y);
                    
                    // Radial and height falloff
                    float radialFade = smoothstep(DISK_OUTER, DISK_INNER, r);
                    float heightFade = 1.0 - smoothstep(0.0, 0.3, h);
                    
                    // Turbulence
                    float angle = atan(p.z, p.x);
                    float turbAngle = angle - uTime * 0.3 / max(0.3, r - DISK_INNER + 0.5);
                    float turb = 0.6 + 0.4 * noise(vec2(r * 5.0, turbAngle * 4.0));
                    
                    return radialFade * heightFade * turb;
                }
                
                // Disk color at position
                vec3 diskColor(vec3 p, vec3 rd) {
                    float r = length(p.xz);
                    
                    // Temperature gradient (hotter near center)
                    float temp = 40000.0 * pow(DISK_INNER / r, 0.75);
                    
                    // Doppler beaming (orbital velocity)
                    vec3 vel = normalize(vec3(-p.z, 0.0, p.x));
                    float vDotR = dot(vel, rd);
                    float doppler = 0.5 + 0.5 * vDotR;
                    doppler = pow(doppler, 1.5) * 1.8;
                    
                    vec3 col = blackbody(temp);
                    col *= doppler;
                    
                    return col;
                }
                
                void main() {
                    vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y;
                    
                    // Camera
                    vec3 ro = uCamPos;
                    vec3 forward = normalize(-ro);
                    vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), forward));
                    vec3 up = cross(forward, right);
                    vec3 rd = normalize(forward + uv.x * right + uv.y * up);
                    
                    // Save original direction for stars
                    vec3 rdOriginal = rd;
                    
                    vec3 col = vec3(0.0);
                    float accum = 0.0;
                    
                    // ===== RAY MARCHING =====
                    float t = 0.0;
                    bool hitHorizon = false;
                    
                    for (int i = 0; i < MAX_STEPS; i++) {
                        vec3 p = ro + rd * t;
                        float r = length(p);
                        
                        // Event horizon
                        if (r < RS) {
                            hitHorizon = true;
                            break;
                        }
                        
                        if (r > 25.0) break;
                        
                        // Adaptive step size
                        float stepSize = max(0.02, (r - RS) * 0.03);
                        
                        // Gravitational lensing
                        if (r < 20.0) {
                            vec3 toCenter = -normalize(p);
                            float bend = uLensing * 2.5 * RS / (r * r);
                            rd = normalize(rd + toCenter * bend * stepSize);
                        }
                        
                        // Sample accretion disk
                        if (abs(p.y) < 0.35 && r > DISK_INNER * 0.8 && r < DISK_OUTER + 1.0) {
                            float density = diskDensity(p);
                            
                            if (density > 0.01) {
                                vec3 diskCol = diskColor(p, rd);
                                float intensity = density * uBrightness * 0.12;
                                
                                float alpha = intensity * (1.0 - accum);
                                col += diskCol * alpha;
                                accum += alpha * 0.15;
                            }
                        }
                        
                        t += stepSize;
                    }
                    
                    // ===== STARS (behind disk, not in horizon) =====
                    if (!hitHorizon) {
                        vec3 starCol = stars(rdOriginal);
                        col += starCol * (1.0 - min(1.0, accum * 2.0));
                    }
                    
                    // ===== PHOTON RING (gravitational lensing of disk) =====
                    // This creates the bright ring around the black hole
                    float screenR = length(uv);
                    float ringDist = screenR - 0.08;
                    float ring = exp(-ringDist * ringDist * 400.0);
                    
                    // Ring color (blended from disk colors)
                    vec3 ringCol = mix(
                        vec3(1.0, 0.6, 0.3),  // Orange
                        vec3(0.8, 0.9, 1.0),   // Blue-white
                        sin(uTime * 0.5 + screenR * 10.0) * 0.5 + 0.5
                    );
                    col += ringCol * ring * 0.8 * uBrightness * (1.0 - min(1.0, accum));
                    
                    // Inner glow edge
                    float innerGlow = exp(-pow((screenR - 0.06) * 50.0, 2.0)) * 0.5;
                    col += vec3(1.0, 0.8, 0.5) * innerGlow * uBrightness;
                    
                    // Tone mapping
                    col = col / (1.0 + col);
                    
                    // Gamma correction
                    col = pow(col, vec3(0.4545));
                    
                    gl_FragColor = vec4(col, 1.0);
                }
            `;
            
            material = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: {
                    uTime: { value: 0.0 },
                    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    uCamPos: { value: new THREE.Vector3(0, 2, zoom) },
                    uBrightness: { value: 2.5 },
                    uLensing: { value: 1.0 }
                }
            });
            
            console.log('Material created');
            
            const geometry = new THREE.PlaneGeometry(2, 2);
            scene.add(new THREE.Mesh(geometry, material));
            
            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
            });
            
            document.addEventListener('mousedown', (e) => { 
                isDragging = true; 
                lastX = e.clientX; 
                lastY = e.clientY; 
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                targetRotY += (e.clientX - lastX) * 0.005;
                targetRotX += (e.clientY - lastY) * 0.005;
                targetRotX = Math.max(-1.2, Math.min(1.2, targetRotX));
                lastX = e.clientX;
                lastY = e.clientY;
            });
            
            document.addEventListener('mouseup', () => { isDragging = false; });
            
            document.addEventListener('wheel', (e) => {
                zoom += e.deltaY * 0.01;
                zoom = Math.max(5, Math.min(20, zoom));
            }, { passive: true });
            
            document.getElementById('brightness').addEventListener('input', (e) => {
                material.uniforms.uBrightness.value = parseFloat(e.target.value);
            });
            
            document.getElementById('lensing').addEventListener('input', (e) => {
                material.uniforms.uLensing.value = parseFloat(e.target.value);
            });
            
            console.log('Starting animation...');
            animate();
        }
        
        function updateDebug() {
            const cam = material.uniforms.uCamPos.value;
            document.getElementById('debug').innerHTML = 
                'Camera: (' + cam.x.toFixed(1) + ', ' + cam.y.toFixed(1) + ', ' + cam.z.toFixed(1) + ')<br>' +
                'Zoom: ' + zoom.toFixed(1) + '<br>' +
                'Brightness: ' + material.uniforms.uBrightness.value.toFixed(1);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            material.uniforms.uTime.value += 0.016;
            
            rotX += (targetRotX - rotX) * 0.1;
            rotY += (targetRotY - rotY) * 0.1;
            
            material.uniforms.uCamPos.value.set(
                Math.sin(rotY) * Math.cos(rotX) * zoom,
                Math.sin(rotX) * zoom,
                Math.cos(rotY) * Math.cos(rotX) * zoom
            );
            
            if (Math.floor(material.uniforms.uTime.value * 10) % 10 === 0) updateDebug();
            
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
