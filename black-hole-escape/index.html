<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hole Escape - 黑洞逃亡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameCanvas {
            border: 4px solid #0ff;
            image-rendering: pixelated;
            cursor: none;
        }
        /* CRT Scanline Effect */
        #crtOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
        }
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a0a2e 0%, #0d0015 50%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #startScreen h1 {
            font-size: 42px;
            color: #0ff;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #f0f;
            animation: pulse 2s infinite;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }
        #startScreen .subtitle {
            font-size: 24px;
            color: #f0f;
            text-shadow: 0 0 10px #f0f;
            margin-bottom: 40px;
        }
        #startScreen .instructions {
            color: #fff;
            font-size: 15px;
            text-align: left;
            line-height: 2.2;
            max-width: 500px;
        }
        #startScreen .instructions .row {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }
        #startScreen .instructions .icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            display: inline-block;
        }
        #startScreen .click-hint {
            font-size: 28px;
            color: #ff0;
            text-shadow: 0 0 10px #ff0;
            animation: blink 1s infinite;
            margin-top: 40px;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
        .pixel-border {
            padding: 20px 40px;
            border: 4px solid #0ff;
            box-shadow: 0 0 20px #0ff, inset 0 0 20px rgba(0, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div id="crtOverlay"></div>
    <div id="startScreen">
        <h1>BLACK HOLE ESCAPE</h1>
        <div class="subtitle">- 黑洞逃亡 -</div>
        <div class="pixel-border">
            <div class="instructions">
                <div class="row"><canvas class="icon" id="iconShip"></canvas> 控制飞船躲避黑洞引力</div>
                <div class="row"><canvas class="icon" id="iconStar"></canvas> 收集星星获得分数</div>
                <div class="row"><canvas class="icon" id="iconMeteor"></canvas> 躲避陨石 - 直线移动</div>
                <div class="row"><canvas class="icon" id="iconAlien"></canvas> 外星人UFO - 追踪玩家</div>
                <div class="row"><canvas class="icon" id="iconShield"></canvas> 护盾道具 - 免疫3秒</div>
                <div class="row"><canvas class="icon" id="iconSpeed"></canvas> 加速道具 - 5秒加速</div>
                <br>
                <div style="text-align: center; color: #0ff;">
                    [WASD] 或 [方向键] 控制移动<br>
                    越靠近黑洞，引力越强！
                </div>
            </div>
        </div>
        <div class="click-hint">&gt;&gt;&gt; 点击开始游戏 &lt;&lt;&lt;</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // ==================== Pixel Art Drawing Functions ====================
        const PIXEL_SIZE = 2;

        function drawPixel(ctx, x, y, color, size = PIXEL_SIZE) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x), Math.floor(y), size, size);
        }

        function drawPixelRect(ctx, x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
        }

        // Pixel Spaceship (white/cyan triangle)
        function drawPixelShip(ctx, x, y, size, shield = false, speedBoost = false) {
            const s = size;
            ctx.save();
            ctx.translate(x, y);

            // Speed boost trail
            if (speedBoost) {
                ctx.fillStyle = 'rgba(255, 255, 0, 0.6)';
                for (let i = 0; i < 3; i++) {
                    const trailSize = 4 - i;
                    ctx.fillRect(-s - 4 - i * 6, -trailSize, trailSize * 2, trailSize * 2);
                }
            }

            // Shield effect
            if (shield) {
                const shieldAlpha = 0.4 + Math.sin(Date.now() / 80) * 0.2;
                ctx.strokeStyle = `rgba(0, 255, 255, ${shieldAlpha})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, s + 6, 0, Math.PI * 2);
                ctx.stroke();

                // Shield hexagon overlay
                ctx.strokeStyle = `rgba(0, 255, 255, ${shieldAlpha + 0.2})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
                    const px = Math.cos(angle) * (s + 4);
                    const py = Math.sin(angle) * (s + 4);
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
            }

            // Ship body - triangular shape
            // Main body (cyan)
            const shipPixels = [
                // Nose
                [0, -s, '#0ff'],
                // Upper body
                [-2, -s+4, '#0ff'], [2, -s+4, '#0ff'],
                [-4, -s+8, '#0ff'], [0, -s+8, '#fff'], [4, -s+8, '#0ff'],
                // Mid body
                [-6, -s+12, '#0ff'], [-2, -s+12, '#fff'], [2, -s+12, '#fff'], [6, -s+12, '#0ff'],
                // Lower body
                [-8, -s+16, '#0af'], [-4, -s+16, '#0ff'], [0, -s+16, '#fff'], [4, -s+16, '#0ff'], [8, -s+16, '#0af'],
                // Wings
                [-10, -s+18, '#08f'], [10, -s+18, '#08f'],
                [-10, -s+20, '#06f'], [10, -s+20, '#06f'],
                // Engine
                [-4, -s+20, '#f80'], [0, -s+20, '#ff0'], [4, -s+20, '#f80'],
                [-2, -s+24, '#f40'], [2, -s+24, '#f40'],
            ];

            shipPixels.forEach(([px, py, color]) => {
                drawPixel(ctx, px - 1, py - 1, color, 3);
            });

            // Cockpit (dark)
            drawPixelRect(ctx, -2, -s+6, 4, 4, '#08f');

            ctx.restore();
        }

        // Pixel Black Hole (purple/magenta vortex)
        function drawPixelBlackHole(ctx, x, y, radius, rotation) {
            // Spiral arms
            for (let arm = 0; arm < 4; arm++) {
                const armAngle = rotation + (arm * Math.PI / 2);
                for (let i = 0; i < 20; i++) {
                    const dist = radius + i * 4;
                    const angle = armAngle + i * 0.15;
                    const px = x + Math.cos(angle) * dist;
                    const py = y + Math.sin(angle) * dist * 0.4;
                    const alpha = 1 - (i / 20);
                    const hue = 280 + i * 3;

                    ctx.fillStyle = `hsla(${hue}, 100%, 60%, ${alpha * 0.6})`;
                    const pixelSize = 6 - (i * 0.2);
                    ctx.fillRect(px - pixelSize/2, py - pixelSize/2, pixelSize, pixelSize);
                }
            }

            // Inner glow rings
            for (let r = radius; r > radius - 15; r -= 3) {
                const alpha = (radius - r) / 15;
                ctx.strokeStyle = `rgba(200, 50, 200, ${alpha * 0.5})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Event horizon (black center)
            const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
            gradient.addColorStop(0, '#000');
            gradient.addColorStop(0.6, '#0a0015');
            gradient.addColorStop(1, '#2a0a3a');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();

            // Pixel vortex pattern in center
            for (let ring = 0; ring < 3; ring++) {
                const ringRadius = radius * 0.3 + ring * 6;
                const segments = 8 + ring * 2;
                for (let i = 0; i < segments; i++) {
                    const angle = rotation * 2 + (i / segments) * Math.PI * 2;
                    const px = x + Math.cos(angle) * ringRadius;
                    const py = y + Math.sin(angle) * ringRadius;
                    const color = ring % 2 === 0 ? '#c0f' : '#f0c';
                    ctx.fillStyle = color;
                    ctx.fillRect(px - 2, py - 2, 4, 4);
                }
            }

            // Dark core
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x, y, radius * 0.25, 0, Math.PI * 2);
            ctx.fill();
        }

        // Pixel Star (yellow sparkle)
        function drawPixelStar(ctx, x, y, size, pulse) {
            const scale = 1 + Math.sin(pulse) * 0.2;
            const s = size * scale;

            // Glow
            ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
            ctx.fillRect(x - s, y - s, s * 2, s * 2);

            // Star shape (4-pointed)
            const starPixels = [
                [0, -s, '#fff'],
                [-1, -s+2, '#ff0'], [1, -s+2, '#ff0'],
                [-s, 0, '#fff'], [0, 0, '#fff'], [s, 0, '#fff'],
                [-1, s-2, '#ff0'], [1, s-2, '#ff0'],
                [0, s, '#fff'],
                [-2, -2, '#ff8'], [2, -2, '#ff8'], [-2, 2, '#ff8'], [2, 2, '#ff8'],
            ];

            starPixels.forEach(([px, py, color]) => {
                drawPixel(ctx, x + px - 1, y + py - 1, color, 3);
            });
        }

        // Pixel Meteor (gray/brown irregular rock)
        function drawPixelMeteor(ctx, x, y, size, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);

            const s = size / 2;

            // Irregular rock shape
            const meteorPixels = [
                // Main body
                [-s, -2, '#666'], [-s+2, -4, '#777'], [-s+4, -s+2, '#888'],
                [-s+2, 0, '#5a5a5a'], [0, -4, '#888'], [2, -s+2, '#777'],
                [s-4, 0, '#666'], [s-2, -2, '#777'], [s-2, 2, '#5a5a5a'],
                // Details
                [-4, 2, '#4a4a4a'], [0, 2, '#666'], [4, -2, '#5a5a5a'],
                [-2, 4, '#777'], [2, 4, '#666'], [0, s-2, '#5a5a5a'],
                // Craters
                [-s+4, -2, '#3a3a3a'], [2, 0, '#3a3a3a'], [-2, -2, '#4a4a4a'],
                // Brown accents
                [-s+2, 2, '#8b4513'], [s-4, 2, '#a0522d'],
            ];

            meteorPixels.forEach(([px, py, color]) => {
                drawPixel(ctx, px - 2, py - 2, color, 4);
            });

            // Fire trail
            const trailColors = ['#f80', '#fa0', '#ff0'];
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = trailColors[i];
                ctx.fillRect(-8 - i * 4, -2 + i, 4, 4 - i);
            }

            ctx.restore();
        }

        // Pixel UFO/Alien (green)
        function drawPixelUFO(ctx, x, y, size, wobble) {
            const wobbleX = Math.sin(wobble) * 3;
            const s = size / 2;

            ctx.save();
            ctx.translate(x + wobbleX, y);

            // Beam (occasional)
            if (Math.sin(wobble * 0.5) > 0.5) {
                ctx.fillStyle = 'rgba(0, 255, 100, 0.2)';
                ctx.beginPath();
                ctx.moveTo(-s, 0);
                ctx.lineTo(s, 0);
                ctx.lineTo(s + 4, s + 10);
                ctx.lineTo(-s - 4, s + 10);
                ctx.closePath();
                ctx.fill();
            }

            // UFO body
            const ufoPixels = [
                // Top dome
                [0, -s-2, '#0f0'],
                [-2, -s, '#0d0'], [2, -s, '#0d0'],
                [-4, -s+2, '#0a0'], [0, -s+2, '#0f0'], [4, -s+2, '#0a0'],
                // Main body
                [-s, 0, '#0d0'], [-s+2, 0, '#0f0'], [s-2, 0, '#0f0'], [s, 0, '#0d0'],
                [-s+4, -2, '#080'], [-4, -2, '#0a0'], [4, -2, '#0a0'], [s-4, -2, '#080'],
                // Lights
                [-s+2, 2, '#ff0'], [-2, 2, '#0ff'], [2, 2, '#0ff'], [s-2, 2, '#ff0'],
                // Bottom
                [-4, 4, '#060'], [4, 4, '#060'],
            ];

            ufoPixels.forEach(([px, py, color]) => {
                drawPixel(ctx, px - 2, py - 2, color, 4);
            });

            // Window/cockpit
            ctx.fillStyle = '#0ff';
            ctx.fillRect(-2, -s, 4, 4);
            ctx.fillStyle = '#fff';
            ctx.fillRect(-1, -s+1, 2, 2);

            ctx.restore();
        }

        // Pixel Shield Power-up (blue energy orb)
        function drawPixelShieldPU(ctx, x, y, size, pulse) {
            const scale = 1 + Math.sin(pulse) * 0.15;
            const s = size * scale / 2;

            // Outer glow
            ctx.fillStyle = 'rgba(0, 200, 255, 0.3)';
            ctx.fillRect(x - s - 4, y - s - 4, (s + 4) * 2, (s + 4) * 2);

            // Shield icon (hexagon)
            const shieldPixels = [
                // Top
                [0, -s, '#0ff'],
                [-2, -s+2, '#0df'], [2, -s+2, '#0df'],
                // Sides
                [-s+2, -2, '#0bf'], [s-2, -2, '#0bf'],
                [-s+2, 2, '#0bf'], [s-2, 2, '#0bf'],
                // Bottom
                [-2, s-2, '#0df'], [2, s-2, '#0df'],
                [0, s, '#0ff'],
                // Center
                [-1, -1, '#fff'], [1, -1, '#8ff'],
                [-1, 1, '#8ff'], [1, 1, '#fff'],
            ];

            shieldPixels.forEach(([px, py, color]) => {
                drawPixel(ctx, x + px - 1, y + py - 1, color, 3);
            });
        }

        // Pixel Speed Power-up (yellow lightning)
        function drawPixelSpeedPU(ctx, x, y, size, pulse) {
            const scale = 1 + Math.sin(pulse) * 0.15;
            const s = size * scale / 2;

            // Glow
            ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
            ctx.fillRect(x - s - 4, y - s - 4, (s + 4) * 2, (s + 4) * 2);

            // Lightning bolt
            const boltPixels = [
                // Top
                [2, -s, '#fff'],
                [0, -s+2, '#ff0'], [2, -s+2, '#ff8'],
                [-2, -s+4, '#ff0'], [0, -s+4, '#fff'],
                // Middle
                [-2, 0, '#ff0'], [0, 0, '#fff'], [2, 0, '#ff8'],
                [-4, 2, '#ff0'], [-2, 2, '#fff'],
                // Bottom
                [-4, s-2, '#ff0'], [-2, s-2, '#ff8'],
                [-2, s, '#fff'],
            ];

            boltPixels.forEach(([px, py, color]) => {
                drawPixel(ctx, x + px - 1, y + py - 1, color, 3);
            });
        }

        // Pixel Particle (small square)
        function drawPixelParticle(ctx, x, y, size, color, alpha) {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            const s = Math.max(2, Math.floor(size));
            ctx.fillRect(Math.floor(x) - s/2, Math.floor(y) - s/2, s, s);
            ctx.globalAlpha = 1;
        }

        // Draw icons for start screen
        function drawStartScreenIcons() {
            const icons = [
                { id: 'iconShip', draw: (c, cx, cy) => drawPixelShip(c, cx, cy, 10) },
                { id: 'iconStar', draw: (c, cx, cy) => drawPixelStar(c, cx, cy, 8, 0) },
                { id: 'iconMeteor', draw: (c, cx, cy) => drawPixelMeteor(c, cx, cy, 16, 0.5) },
                { id: 'iconAlien', draw: (c, cx, cy) => drawPixelUFO(c, cx, cy, 16, 0) },
                { id: 'iconShield', draw: (c, cx, cy) => drawPixelShieldPU(c, cx, cy, 12, 0) },
                { id: 'iconSpeed', draw: (c, cx, cy) => drawPixelSpeedPU(c, cx, cy, 12, 0) },
            ];

            icons.forEach(icon => {
                const canvas = document.getElementById(icon.id);
                if (canvas) {
                    canvas.width = 24;
                    canvas.height = 24;
                    const ctx = canvas.getContext('2d');
                    icon.draw(ctx, 12, 12);
                }
            });
        }

        // ==================== Audio System ====================
        class AudioSystem {
            constructor() {
                this.ctx = null;
                this.enabled = false;
                this.bgmOscillators = [];
                this.bgmGains = [];
                this.masterGain = null;
                this.bgmPlaying = false;
            }

            init() {
                if (this.ctx) return;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.3;
                this.masterGain.connect(this.ctx.destination);
                this.enabled = true;
            }

            playNote(freq, duration, type = 'square', volume = 0.3) {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            playCollect() {
                this.playNote(880, 0.1, 'square', 0.2);
                setTimeout(() => this.playNote(1100, 0.1, 'square', 0.2), 50);
                setTimeout(() => this.playNote(1320, 0.15, 'square', 0.2), 100);
            }

            playPowerUp() {
                [523, 659, 784, 1047].forEach((freq, i) => {
                    setTimeout(() => this.playNote(freq, 0.15, 'square', 0.25), i * 80);
                });
            }

            playHit() {
                this.playNote(150, 0.2, 'sawtooth', 0.4);
                this.playNote(100, 0.3, 'sawtooth', 0.3);
            }

            playDeath() {
                const notes = [440, 392, 349, 330, 294, 262, 220, 196];
                notes.forEach((freq, i) => {
                    setTimeout(() => this.playNote(freq, 0.2, 'sawtooth', 0.3), i * 100);
                });
            }

            startBGM() {
                if (!this.enabled || !this.ctx || this.bgmPlaying) return;
                this.bgmPlaying = true;

                // 8-bit style bass line
                const bassNotes = [65, 82, 98, 82]; // C2, E2, G2, E2
                let noteIndex = 0;
                const bpm = 120;
                const beatDuration = 60 / bpm;

                const playBassNote = () => {
                    if (!this.bgmPlaying) return;
                    const freq = bassNotes[noteIndex % bassNotes.length];
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + beatDuration * 0.8);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start();
                    osc.stop(this.ctx.currentTime + beatDuration);
                    noteIndex++;
                    this.bgmTimeout = setTimeout(playBassNote, beatDuration * 1000);
                };

                // Arpeggios
                const arpNotes = [262, 330, 392, 523, 392, 330]; // C4, E4, G4, C5, G4, E4
                let arpIndex = 0;

                const playArp = () => {
                    if (!this.bgmPlaying) return;
                    const freq = arpNotes[arpIndex % arpNotes.length];
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                    arpIndex++;
                    this.arpTimeout = setTimeout(playArp, beatDuration * 250);
                };

                playBassNote();
                setTimeout(playArp, 200);
            }

            stopBGM() {
                this.bgmPlaying = false;
                if (this.bgmTimeout) clearTimeout(this.bgmTimeout);
                if (this.arpTimeout) clearTimeout(this.arpTimeout);
            }
        }

        // ==================== Game ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const audio = new AudioSystem();

        canvas.width = 800;
        canvas.height = 600;

        // Game state
        let gameRunning = false;
        let score = 0;
        let survivalTime = 0;
        let lastTime = 0;
        let gameStartTime = 0;

        // Black hole
        const blackHole = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 40,
            pullRadius: 300,
            rotation: 0
        };

        // Player
        const player = {
            x: canvas.width / 2,
            y: 100,
            vx: 0,
            vy: 0,
            size: 24,
            shield: false,
            shieldTime: 0,
            speedBoost: false,
            speedBoostTime: 0,
            dead: false
        };

        // Collections
        let stars = [];
        let meteors = [];
        let aliens = [];
        let powerUps = [];
        let particles = [];
        let bgStars = [];

        // Keys
        const keys = {};

        // Initialize background stars
        function initBgStars() {
            bgStars = [];
            for (let i = 0; i < 80; i++) {
                bgStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() < 0.3 ? 2 : 1,
                    brightness: Math.random(),
                    twinkleSpeed: Math.random() * 2 + 1,
                    color: Math.random() < 0.1 ? '#f0f' : (Math.random() < 0.2 ? '#0ff' : '#fff')
                });
            }
        }

        // Spawn functions
        function spawnStar() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 200 + Math.random() * 150;
            stars.push({
                x: blackHole.x + Math.cos(angle) * dist,
                y: blackHole.y + Math.sin(angle) * dist,
                size: 12,
                pulse: Math.random() * Math.PI * 2
            });
        }

        function spawnMeteor() {
            const side = Math.floor(Math.random() * 4);
            let x, y, vx, vy;
            const speed = 1.5 + Math.random() * 2;

            switch(side) {
                case 0:
                    x = Math.random() * canvas.width;
                    y = -20;
                    vx = (Math.random() - 0.5) * speed;
                    vy = speed;
                    break;
                case 1:
                    x = canvas.width + 20;
                    y = Math.random() * canvas.height;
                    vx = -speed;
                    vy = (Math.random() - 0.5) * speed;
                    break;
                case 2:
                    x = Math.random() * canvas.width;
                    y = canvas.height + 20;
                    vx = (Math.random() - 0.5) * speed;
                    vy = -speed;
                    break;
                case 3:
                    x = -20;
                    y = Math.random() * canvas.height;
                    vx = speed;
                    vy = (Math.random() - 0.5) * speed;
                    break;
            }

            meteors.push({ x, y, vx, vy, size: 20, rotation: Math.random() * Math.PI * 2 });
        }

        function spawnAlien() {
            const side = Math.floor(Math.random() * 4);
            let x, y;

            switch(side) {
                case 0: x = Math.random() * canvas.width; y = -30; break;
                case 1: x = canvas.width + 30; y = Math.random() * canvas.height; break;
                case 2: x = Math.random() * canvas.width; y = canvas.height + 30; break;
                case 3: x = -30; y = Math.random() * canvas.height; break;
            }

            aliens.push({ x, y, size: 22, speed: 1 + Math.random() * 0.5, wobble: 0 });
        }

        function spawnPowerUp() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 150 + Math.random() * 200;
            const type = Math.random() < 0.5 ? 'shield' : 'speed';
            powerUps.push({
                x: blackHole.x + Math.cos(angle) * dist,
                y: blackHole.y + Math.sin(angle) * dist,
                size: 16,
                type: type,
                pulse: Math.random() * Math.PI * 2
            });
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    color: color,
                    life: 1
                });
            }
        }

        // Update functions
        function updatePlayer(dt) {
            if (player.dead) return;

            const baseSpeed = player.speedBoost ? 6 : 4;
            let ax = 0, ay = 0;

            if (keys['ArrowUp'] || keys['KeyW']) ay -= baseSpeed;
            if (keys['ArrowDown'] || keys['KeyS']) ay += baseSpeed;
            if (keys['ArrowLeft'] || keys['KeyA']) ax -= baseSpeed;
            if (keys['ArrowRight'] || keys['KeyD']) ax += baseSpeed;

            // Black hole gravity
            const dx = blackHole.x - player.x;
            const dy = blackHole.y - player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < blackHole.pullRadius && dist > blackHole.radius) {
                const pullStrength = (1 - dist / blackHole.pullRadius) * 3;
                const pullX = (dx / dist) * pullStrength;
                const pullY = (dy / dist) * pullStrength;
                ax += pullX;
                ay += pullY;
            }

            // Check if sucked into black hole
            if (dist < blackHole.radius + player.size / 2) {
                player.dead = true;
                audio.playDeath();
                createParticles(player.x, player.y, '#f0f', 30);
                return;
            }

            player.vx = player.vx * 0.9 + ax * 0.1;
            player.vy = player.vy * 0.9 + ay * 0.1;

            player.x += player.vx;
            player.y += player.vy;

            // Boundaries
            player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));

            // Update power-up timers
            if (player.shield) {
                player.shieldTime -= dt;
                if (player.shieldTime <= 0) player.shield = false;
            }
            if (player.speedBoost) {
                player.speedBoostTime -= dt;
                if (player.speedBoostTime <= 0) player.speedBoost = false;
            }
        }

        function updateStars(dt) {
            stars.forEach(star => {
                star.pulse += dt * 5;
            });
        }

        function updateMeteors(dt) {
            meteors.forEach(meteor => {
                meteor.x += meteor.vx;
                meteor.y += meteor.vy;
                meteor.rotation += dt * 2;
            });

            // Remove off-screen
            meteors = meteors.filter(m =>
                m.x > -50 && m.x < canvas.width + 50 &&
                m.y > -50 && m.y < canvas.height + 50
            );
        }

        function updateAliens(dt) {
            aliens.forEach(alien => {
                const dx = player.x - alien.x;
                const dy = player.y - alien.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 0) {
                    alien.x += (dx / dist) * alien.speed;
                    alien.y += (dy / dist) * alien.speed;
                }

                alien.wobble += dt * 10;
            });
        }

        function updatePowerUps(dt) {
            powerUps.forEach(p => {
                p.pulse += dt * 5;
            });
        }

        function updateParticles(dt) {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= dt * 2;
                p.size *= 0.98;
            });
            particles = particles.filter(p => p.life > 0);
        }

        function checkCollisions() {
            if (player.dead) return;

            // Stars
            stars = stars.filter(star => {
                const dx = player.x - star.x;
                const dy = player.y - star.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < player.size / 2 + star.size / 2) {
                    score += 10;
                    audio.playCollect();
                    createParticles(star.x, star.y, '#ff0', 8);
                    return false;
                }
                return true;
            });

            // Meteors
            if (!player.shield) {
                meteors.forEach(meteor => {
                    const dx = player.x - meteor.x;
                    const dy = player.y - meteor.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < player.size / 2 + meteor.size / 2) {
                        player.dead = true;
                        audio.playDeath();
                        createParticles(player.x, player.y, '#f80', 30);
                    }
                });
            }

            // Aliens
            if (!player.shield) {
                aliens.forEach(alien => {
                    const dx = player.x - alien.x;
                    const dy = player.y - alien.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < player.size / 2 + alien.size / 2) {
                        player.dead = true;
                        audio.playDeath();
                        createParticles(player.x, player.y, '#0f0', 30);
                    }
                });
            }

            // Power-ups
            powerUps = powerUps.filter(p => {
                const dx = player.x - p.x;
                const dy = player.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < player.size / 2 + p.size / 2) {
                    audio.playPowerUp();
                    createParticles(p.x, p.y, p.type === 'shield' ? '#0ff' : '#ff0', 15);

                    if (p.type === 'shield') {
                        player.shield = true;
                        player.shieldTime = 3;
                    } else {
                        player.speedBoost = true;
                        player.speedBoostTime = 5;
                    }
                    return false;
                }
                return true;
            });
        }

        // Draw functions
        function drawBackground() {
            // Deep space gradient
            const gradient = ctx.createRadialGradient(
                blackHole.x, blackHole.y, 0,
                blackHole.x, blackHole.y, canvas.width
            );
            gradient.addColorStop(0, '#0d0015');
            gradient.addColorStop(0.5, '#050510');
            gradient.addColorStop(1, '#000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background stars (pixel style)
            bgStars.forEach(star => {
                const twinkle = Math.sin(Date.now() / 1000 * star.twinkleSpeed) * 0.3 + 0.7;
                ctx.fillStyle = star.color;
                ctx.globalAlpha = star.brightness * twinkle;
                ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawBlackHole() {
            blackHole.rotation += 0.02;
            drawPixelBlackHole(ctx, blackHole.x, blackHole.y, blackHole.radius, blackHole.rotation);
        }

        function drawPlayer() {
            if (player.dead) return;
            drawPixelShip(ctx, player.x, player.y, player.size, player.shield, player.speedBoost);
        }

        function drawStars() {
            stars.forEach(star => {
                drawPixelStar(ctx, star.x, star.y, star.size, star.pulse);
            });
        }

        function drawMeteors() {
            meteors.forEach(meteor => {
                drawPixelMeteor(ctx, meteor.x, meteor.y, meteor.size, meteor.rotation);
            });
        }

        function drawAliens() {
            aliens.forEach(alien => {
                drawPixelUFO(ctx, alien.x, alien.y, alien.size, alien.wobble);
            });
        }

        function drawPowerUps() {
            powerUps.forEach(p => {
                if (p.type === 'shield') {
                    drawPixelShieldPU(ctx, p.x, p.y, p.size, p.pulse);
                } else {
                    drawPixelSpeedPU(ctx, p.x, p.y, p.size, p.pulse);
                }
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                drawPixelParticle(ctx, p.x, p.y, p.size, p.color, p.life);
            });
        }

        function drawUI() {
            // Score
            ctx.fillStyle = '#0ff';
            ctx.font = 'bold 20px "Courier New", monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 20, 35);

            // Survival time
            ctx.fillStyle = '#f0f';
            ctx.fillText(`TIME: ${survivalTime.toFixed(1)}s`, 20, 60);

            // Power-up status with pixel icons
            let statusY = 90;
            if (player.shield) {
                drawPixelShieldPU(ctx, 30, statusY, 12, Date.now() / 200);
                ctx.fillStyle = '#0ff';
                ctx.fillText(`${player.shieldTime.toFixed(1)}s`, 50, statusY + 5);
                statusY += 30;
            }
            if (player.speedBoost) {
                drawPixelSpeedPU(ctx, 30, statusY, 12, Date.now() / 200);
                ctx.fillStyle = '#ff0';
                ctx.fillText(`${player.speedBoostTime.toFixed(1)}s`, 50, statusY + 5);
            }

            // Game over
            if (player.dead) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Glitch effect on game over text
                const glitchOffset = Math.sin(Date.now() / 50) * 3;

                ctx.fillStyle = '#f00';
                ctx.font = 'bold 48px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2 + glitchOffset, canvas.height / 2 - 30);

                ctx.fillStyle = '#fff';
                ctx.font = '24px "Courier New", monospace';
                ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText(`Time: ${survivalTime.toFixed(1)}s`, canvas.width / 2, canvas.height / 2 + 50);

                ctx.fillStyle = '#0ff';
                ctx.fillText('Click to restart', canvas.width / 2, canvas.height / 2 + 100);
            }
        }

        // Game loop
        let spawnTimers = { star: 0, meteor: 0, alien: 0, powerUp: 0 };

        function update(dt) {
            if (player.dead) return;

            survivalTime = (Date.now() - gameStartTime) / 1000;

            // Spawn logic
            spawnTimers.star += dt;
            spawnTimers.meteor += dt;
            spawnTimers.alien += dt;
            spawnTimers.powerUp += dt;

            if (spawnTimers.star > 2) { spawnStar(); spawnTimers.star = 0; }
            if (spawnTimers.meteor > 3) { spawnMeteor(); spawnTimers.meteor = 0; }
            if (spawnTimers.alien > 6) { spawnAlien(); spawnTimers.alien = 0; }
            if (spawnTimers.powerUp > 10) { spawnPowerUp(); spawnTimers.powerUp = 0; }

            // Increase difficulty over time
            if (survivalTime > 30 && spawnTimers.meteor > 2) {
                if (spawnTimers.meteor > 2) { spawnMeteor(); spawnTimers.meteor = 0; }
            }

            updatePlayer(dt);
            updateStars(dt);
            updateMeteors(dt);
            updateAliens(dt);
            updatePowerUps(dt);
            updateParticles(dt);
            checkCollisions();
        }

        function render() {
            drawBackground();
            drawBlackHole();
            drawStars();
            drawPowerUps();
            drawMeteors();
            drawAliens();
            drawPlayer();
            drawParticles();
            drawUI();
        }

        function gameLoop(timestamp) {
            if (!gameRunning) return;

            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            player.x = canvas.width / 2;
            player.y = 100;
            player.vx = 0;
            player.vy = 0;
            player.shield = false;
            player.speedBoost = false;
            player.dead = false;

            stars = [];
            meteors = [];
            aliens = [];
            powerUps = [];
            particles = [];

            score = 0;
            survivalTime = 0;
            gameStartTime = Date.now();
            spawnTimers = { star: 0, meteor: 0, alien: 0, powerUp: 0 };

            // Initial spawns
            spawnStar();
            spawnStar();
            spawnStar();
        }

        function startGame() {
            audio.init();
            audio.startBGM();
            startScreen.style.display = 'none';
            gameRunning = true;
            initBgStars();
            resetGame();
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        // Event listeners
        startScreen.addEventListener('click', () => {
            if (!gameRunning) startGame();
        });

        canvas.addEventListener('click', () => {
            if (player.dead) {
                resetGame();
            }
        });

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // Initialize
        drawStartScreenIcons();
        initBgStars();
        drawBackground();
        blackHole.x = canvas.width / 2;
        blackHole.y = canvas.height / 2;
        drawBlackHole();
    </script>
</body>
</html>
