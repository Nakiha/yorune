<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hole Escape - 黑洞逃亡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameCanvas {
            border: 4px solid #0ff;
            image-rendering: pixelated;
            cursor: none;
        }
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a0a2e 0%, #0d0015 50%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #startScreen h1 {
            font-size: 48px;
            color: #0ff;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #f0f;
            animation: pulse 2s infinite;
            text-align: center;
            margin-bottom: 20px;
        }
        #startScreen .subtitle {
            font-size: 24px;
            color: #f0f;
            text-shadow: 0 0 10px #f0f;
            margin-bottom: 40px;
        }
        #startScreen .instructions {
            color: #fff;
            font-size: 16px;
            text-align: center;
            line-height: 2;
            margin-bottom: 40px;
            max-width: 500px;
        }
        #startScreen .emoji {
            font-size: 20px;
            margin-right: 10px;
        }
        #startScreen .click-hint {
            font-size: 28px;
            color: #ff0;
            text-shadow: 0 0 10px #ff0;
            animation: blink 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
        .pixel-border {
            padding: 20px 40px;
            border: 4px solid #0ff;
            box-shadow: 0 0 20px #0ff, inset 0 0 20px rgba(0, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>🕳️ BLACK HOLE ESCAPE</h1>
        <div class="subtitle">黑洞逃亡</div>
        <div class="pixel-border">
            <div class="instructions">
                <span class="emoji">🚀</span> 控制飞船躲避黑洞引力<br>
                <span class="emoji">⭐</span> 收集星星获得分数<br>
                <span class="emoji">☄️</span> 躲避陨石 - 直线移动<br>
                <span class="emoji">👾</span> 外星人 - 追踪玩家<br>
                <span class="emoji">🛡️</span> 护盾道具 - 免疫3秒<br>
                <span class="emoji">⚡</span> 加速道具 - 5秒加速<br>
                <br>
                ⬆️⬇️⬅️➡️ 或 WASD 控制移动<br>
                越靠近黑洞，引力越强！
            </div>
        </div>
        <div class="click-hint">>>> 点击开始游戏 <<<</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // ==================== Audio System ====================
        class AudioSystem {
            constructor() {
                this.ctx = null;
                this.enabled = false;
                this.bgmOscillators = [];
                this.bgmGains = [];
                this.masterGain = null;
                this.bgmPlaying = false;
            }

            init() {
                if (this.ctx) return;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.3;
                this.masterGain.connect(this.ctx.destination);
                this.enabled = true;
            }

            playNote(freq, duration, type = 'square', volume = 0.3) {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            playCollect() {
                this.playNote(880, 0.1, 'square', 0.2);
                setTimeout(() => this.playNote(1100, 0.1, 'square', 0.2), 50);
                setTimeout(() => this.playNote(1320, 0.15, 'square', 0.2), 100);
            }

            playPowerUp() {
                [523, 659, 784, 1047].forEach((freq, i) => {
                    setTimeout(() => this.playNote(freq, 0.15, 'square', 0.25), i * 80);
                });
            }

            playHit() {
                this.playNote(150, 0.2, 'sawtooth', 0.4);
                this.playNote(100, 0.3, 'sawtooth', 0.3);
            }

            playDeath() {
                const notes = [440, 392, 349, 330, 294, 262, 220, 196];
                notes.forEach((freq, i) => {
                    setTimeout(() => this.playNote(freq, 0.2, 'sawtooth', 0.3), i * 100);
                });
            }

            startBGM() {
                if (!this.enabled || !this.ctx || this.bgmPlaying) return;
                this.bgmPlaying = true;

                // 8-bit style bass line
                const bassNotes = [65, 82, 98, 82]; // C2, E2, G2, E2
                let noteIndex = 0;
                const bpm = 120;
                const beatDuration = 60 / bpm;

                const playBassNote = () => {
                    if (!this.bgmPlaying) return;
                    const freq = bassNotes[noteIndex % bassNotes.length];
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + beatDuration * 0.8);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start();
                    osc.stop(this.ctx.currentTime + beatDuration);
                    noteIndex++;
                    this.bgmTimeout = setTimeout(playBassNote, beatDuration * 1000);
                };

                // Arpeggios
                const arpNotes = [262, 330, 392, 523, 392, 330]; // C4, E4, G4, C5, G4, E4
                let arpIndex = 0;

                const playArp = () => {
                    if (!this.bgmPlaying) return;
                    const freq = arpNotes[arpIndex % arpNotes.length];
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                    arpIndex++;
                    this.arpTimeout = setTimeout(playArp, beatDuration * 250);
                };

                playBassNote();
                setTimeout(playArp, 200);
            }

            stopBGM() {
                this.bgmPlaying = false;
                if (this.bgmTimeout) clearTimeout(this.bgmTimeout);
                if (this.arpTimeout) clearTimeout(this.arpTimeout);
            }
        }

        // ==================== Game ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const audio = new AudioSystem();

        canvas.width = 800;
        canvas.height = 600;

        // Game state
        let gameRunning = false;
        let score = 0;
        let survivalTime = 0;
        let lastTime = 0;
        let gameStartTime = 0;

        // Black hole
        const blackHole = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 40,
            pullRadius: 300,
            rotation: 0
        };

        // Player
        const player = {
            x: canvas.width / 2,
            y: 100,
            vx: 0,
            vy: 0,
            size: 24,
            shield: false,
            shieldTime: 0,
            speedBoost: false,
            speedBoostTime: 0,
            dead: false
        };

        // Collections
        let stars = [];
        let meteors = [];
        let aliens = [];
        let powerUps = [];
        let particles = [];
        let bgStars = [];

        // Keys
        const keys = {};

        // Initialize background stars
        function initBgStars() {
            bgStars = [];
            for (let i = 0; i < 100; i++) {
                bgStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    brightness: Math.random(),
                    twinkleSpeed: Math.random() * 2 + 1
                });
            }
        }

        // Spawn functions
        function spawnStar() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 200 + Math.random() * 150;
            stars.push({
                x: blackHole.x + Math.cos(angle) * dist,
                y: blackHole.y + Math.sin(angle) * dist,
                size: 16,
                pulse: 0
            });
        }

        function spawnMeteor() {
            const side = Math.floor(Math.random() * 4);
            let x, y, vx, vy;
            const speed = 1.5 + Math.random() * 2;

            switch(side) {
                case 0: // top
                    x = Math.random() * canvas.width;
                    y = -20;
                    vx = (Math.random() - 0.5) * speed;
                    vy = speed;
                    break;
                case 1: // right
                    x = canvas.width + 20;
                    y = Math.random() * canvas.height;
                    vx = -speed;
                    vy = (Math.random() - 0.5) * speed;
                    break;
                case 2: // bottom
                    x = Math.random() * canvas.width;
                    y = canvas.height + 20;
                    vx = (Math.random() - 0.5) * speed;
                    vy = -speed;
                    break;
                case 3: // left
                    x = -20;
                    y = Math.random() * canvas.height;
                    vx = speed;
                    vy = (Math.random() - 0.5) * speed;
                    break;
            }

            meteors.push({ x, y, vx, vy, size: 20, rotation: Math.random() * Math.PI * 2 });
        }

        function spawnAlien() {
            const side = Math.floor(Math.random() * 4);
            let x, y;

            switch(side) {
                case 0: x = Math.random() * canvas.width; y = -30; break;
                case 1: x = canvas.width + 30; y = Math.random() * canvas.height; break;
                case 2: x = Math.random() * canvas.width; y = canvas.height + 30; break;
                case 3: x = -30; y = Math.random() * canvas.height; break;
            }

            aliens.push({ x, y, size: 22, speed: 1 + Math.random() * 0.5, wobble: 0 });
        }

        function spawnPowerUp() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 150 + Math.random() * 200;
            const type = Math.random() < 0.5 ? 'shield' : 'speed';
            powerUps.push({
                x: blackHole.x + Math.cos(angle) * dist,
                y: blackHole.y + Math.sin(angle) * dist,
                size: 18,
                type: type,
                pulse: 0
            });
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    color: color,
                    life: 1
                });
            }
        }

        // Update functions
        function updatePlayer(dt) {
            if (player.dead) return;

            const baseSpeed = player.speedBoost ? 6 : 4;
            let ax = 0, ay = 0;

            if (keys['ArrowUp'] || keys['KeyW']) ay -= baseSpeed;
            if (keys['ArrowDown'] || keys['KeyS']) ay += baseSpeed;
            if (keys['ArrowLeft'] || keys['KeyA']) ax -= baseSpeed;
            if (keys['ArrowRight'] || keys['KeyD']) ax += baseSpeed;

            // Black hole gravity
            const dx = blackHole.x - player.x;
            const dy = blackHole.y - player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < blackHole.pullRadius && dist > blackHole.radius) {
                const pullStrength = (1 - dist / blackHole.pullRadius) * 3;
                const pullX = (dx / dist) * pullStrength;
                const pullY = (dy / dist) * pullStrength;
                ax += pullX;
                ay += pullY;
            }

            // Check if sucked into black hole
            if (dist < blackHole.radius + player.size / 2) {
                player.dead = true;
                audio.playDeath();
                createParticles(player.x, player.y, '#f0f', 30);
                return;
            }

            player.vx = player.vx * 0.9 + ax * 0.1;
            player.vy = player.vy * 0.9 + ay * 0.1;

            player.x += player.vx;
            player.y += player.vy;

            // Boundaries
            player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));

            // Update power-up timers
            if (player.shield) {
                player.shieldTime -= dt;
                if (player.shieldTime <= 0) player.shield = false;
            }
            if (player.speedBoost) {
                player.speedBoostTime -= dt;
                if (player.speedBoostTime <= 0) player.speedBoost = false;
            }
        }

        function updateStars(dt) {
            stars.forEach(star => {
                star.pulse += dt * 5;
            });
        }

        function updateMeteors(dt) {
            meteors.forEach(meteor => {
                meteor.x += meteor.vx;
                meteor.y += meteor.vy;
                meteor.rotation += dt * 2;
            });

            // Remove off-screen
            meteors = meteors.filter(m =>
                m.x > -50 && m.x < canvas.width + 50 &&
                m.y > -50 && m.y < canvas.height + 50
            );
        }

        function updateAliens(dt) {
            aliens.forEach(alien => {
                const dx = player.x - alien.x;
                const dy = player.y - alien.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 0) {
                    alien.x += (dx / dist) * alien.speed;
                    alien.y += (dy / dist) * alien.speed;
                }

                alien.wobble += dt * 10;
            });
        }

        function updatePowerUps(dt) {
            powerUps.forEach(p => {
                p.pulse += dt * 5;
            });
        }

        function updateParticles(dt) {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= dt * 2;
                p.size *= 0.98;
            });
            particles = particles.filter(p => p.life > 0);
        }

        function checkCollisions() {
            if (player.dead) return;

            // Stars
            stars = stars.filter(star => {
                const dx = player.x - star.x;
                const dy = player.y - star.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < player.size / 2 + star.size / 2) {
                    score += 10;
                    audio.playCollect();
                    createParticles(star.x, star.y, '#ff0', 8);
                    return false;
                }
                return true;
            });

            // Meteors
            if (!player.shield) {
                meteors.forEach(meteor => {
                    const dx = player.x - meteor.x;
                    const dy = player.y - meteor.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < player.size / 2 + meteor.size / 2) {
                        player.dead = true;
                        audio.playDeath();
                        createParticles(player.x, player.y, '#f80', 30);
                    }
                });
            }

            // Aliens
            if (!player.shield) {
                aliens.forEach(alien => {
                    const dx = player.x - alien.x;
                    const dy = player.y - alien.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < player.size / 2 + alien.size / 2) {
                        player.dead = true;
                        audio.playDeath();
                        createParticles(player.x, player.y, '#0f0', 30);
                    }
                });
            }

            // Power-ups
            powerUps = powerUps.filter(p => {
                const dx = player.x - p.x;
                const dy = player.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < player.size / 2 + p.size / 2) {
                    audio.playPowerUp();
                    createParticles(p.x, p.y, p.type === 'shield' ? '#0ff' : '#ff0', 15);

                    if (p.type === 'shield') {
                        player.shield = true;
                        player.shieldTime = 3;
                    } else {
                        player.speedBoost = true;
                        player.speedBoostTime = 5;
                    }
                    return false;
                }
                return true;
            });
        }

        // Draw functions
        function drawBackground() {
            // Deep space gradient
            const gradient = ctx.createRadialGradient(
                blackHole.x, blackHole.y, 0,
                blackHole.x, blackHole.y, canvas.width
            );
            gradient.addColorStop(0, '#0d0015');
            gradient.addColorStop(0.5, '#050510');
            gradient.addColorStop(1, '#000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background stars
            bgStars.forEach(star => {
                const twinkle = Math.sin(Date.now() / 1000 * star.twinkleSpeed) * 0.3 + 0.7;
                ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness * twinkle})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawBlackHole() {
            blackHole.rotation += 0.02;

            // Accretion disk
            for (let i = 5; i >= 0; i--) {
                const radius = blackHole.radius + 20 + i * 15;
                const alpha = 0.3 - i * 0.04;
                const hue = (280 + i * 20 + blackHole.rotation * 10) % 360;

                ctx.save();
                ctx.translate(blackHole.x, blackHole.y);
                ctx.rotate(blackHole.rotation + i * 0.1);

                ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${alpha})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.ellipse(0, 0, radius, radius * 0.3, 0, 0, Math.PI * 2);
                ctx.stroke();

                ctx.restore();
            }

            // Event horizon
            const bhGradient = ctx.createRadialGradient(
                blackHole.x, blackHole.y, 0,
                blackHole.x, blackHole.y, blackHole.radius
            );
            bhGradient.addColorStop(0, '#000');
            bhGradient.addColorStop(0.7, '#000');
            bhGradient.addColorStop(1, '#2a0a3a');
            ctx.fillStyle = bhGradient;
            ctx.beginPath();
            ctx.arc(blackHole.x, blackHole.y, blackHole.radius, 0, Math.PI * 2);
            ctx.fill();

            // Center glow
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(blackHole.x, blackHole.y, blackHole.radius * 0.7, 0, Math.PI * 2);
            ctx.fill();

            // Emoji
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🕳️', blackHole.x, blackHole.y);
        }

        function drawPlayer() {
            if (player.dead) return;

            ctx.save();
            ctx.translate(player.x, player.y);

            // Shield effect
            if (player.shield) {
                ctx.strokeStyle = `rgba(0, 255, 255, ${0.5 + Math.sin(Date.now() / 100) * 0.3})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, player.size + 5, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Speed boost effect
            if (player.speedBoost) {
                ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.arc(-10 - i * 8, 0, 5 - i, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Ship emoji
            ctx.font = `${player.size}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🚀', 0, 0);

            ctx.restore();
        }

        function drawStars() {
            stars.forEach(star => {
                const scale = 1 + Math.sin(star.pulse) * 0.2;
                ctx.font = `${star.size * scale}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⭐', star.x, star.y);
            });
        }

        function drawMeteors() {
            meteors.forEach(meteor => {
                ctx.save();
                ctx.translate(meteor.x, meteor.y);
                ctx.rotate(meteor.rotation);
                ctx.font = `${meteor.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('☄️', 0, 0);
                ctx.restore();
            });
        }

        function drawAliens() {
            aliens.forEach(alien => {
                const wobbleOffset = Math.sin(alien.wobble) * 3;
                ctx.font = `${alien.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('👾', alien.x + wobbleOffset, alien.y);
            });
        }

        function drawPowerUps() {
            powerUps.forEach(p => {
                const scale = 1 + Math.sin(p.pulse) * 0.15;
                ctx.font = `${p.size * scale}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.type === 'shield' ? '🛡️' : '⚡', p.x, p.y);
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
                ctx.globalAlpha = 1;
            });
        }

        function drawUI() {
            // Score
            ctx.fillStyle = '#0ff';
            ctx.font = 'bold 24px "Courier New", monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 20, 40);

            // Survival time
            ctx.fillStyle = '#f0f';
            ctx.fillText(`TIME: ${survivalTime.toFixed(1)}s`, 20, 70);

            // Power-up status
            let statusY = 100;
            if (player.shield) {
                ctx.fillStyle = '#0ff';
                ctx.fillText(`🛡️ ${player.shieldTime.toFixed(1)}s`, 20, statusY);
                statusY += 30;
            }
            if (player.speedBoost) {
                ctx.fillStyle = '#ff0';
                ctx.fillText(`⚡ ${player.speedBoostTime.toFixed(1)}s`, 20, statusY);
            }

            // Game over
            if (player.dead) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#f00';
                ctx.font = 'bold 48px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = '#fff';
                ctx.font = '24px "Courier New", monospace';
                ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText(`Time: ${survivalTime.toFixed(1)}s`, canvas.width / 2, canvas.height / 2 + 50);

                ctx.fillStyle = '#0ff';
                ctx.fillText('Click to restart', canvas.width / 2, canvas.height / 2 + 100);
            }
        }

        // Game loop
        let spawnTimers = { star: 0, meteor: 0, alien: 0, powerUp: 0 };

        function update(dt) {
            if (player.dead) return;

            survivalTime = (Date.now() - gameStartTime) / 1000;

            // Spawn logic
            spawnTimers.star += dt;
            spawnTimers.meteor += dt;
            spawnTimers.alien += dt;
            spawnTimers.powerUp += dt;

            if (spawnTimers.star > 2) { spawnStar(); spawnTimers.star = 0; }
            if (spawnTimers.meteor > 3) { spawnMeteor(); spawnTimers.meteor = 0; }
            if (spawnTimers.alien > 6) { spawnAlien(); spawnTimers.alien = 0; }
            if (spawnTimers.powerUp > 10) { spawnPowerUp(); spawnTimers.powerUp = 0; }

            // Increase difficulty over time
            if (survivalTime > 30 && spawnTimers.meteor > 2) {
                if (spawnTimers.meteor > 2) { spawnMeteor(); spawnTimers.meteor = 0; }
            }

            updatePlayer(dt);
            updateStars(dt);
            updateMeteors(dt);
            updateAliens(dt);
            updatePowerUps(dt);
            updateParticles(dt);
            checkCollisions();
        }

        function render() {
            drawBackground();
            drawBlackHole();
            drawStars();
            drawPowerUps();
            drawMeteors();
            drawAliens();
            drawPlayer();
            drawParticles();
            drawUI();
        }

        function gameLoop(timestamp) {
            if (!gameRunning) return;

            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            player.x = canvas.width / 2;
            player.y = 100;
            player.vx = 0;
            player.vy = 0;
            player.shield = false;
            player.speedBoost = false;
            player.dead = false;

            stars = [];
            meteors = [];
            aliens = [];
            powerUps = [];
            particles = [];

            score = 0;
            survivalTime = 0;
            gameStartTime = Date.now();
            spawnTimers = { star: 0, meteor: 0, alien: 0, powerUp: 0 };

            // Initial spawns
            spawnStar();
            spawnStar();
            spawnStar();
        }

        function startGame() {
            audio.init();
            audio.startBGM();
            startScreen.style.display = 'none';
            gameRunning = true;
            initBgStars();
            resetGame();
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        // Event listeners
        startScreen.addEventListener('click', () => {
            if (!gameRunning) startGame();
        });

        canvas.addEventListener('click', () => {
            if (player.dead) {
                resetGame();
            }
        });

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // Initial render
        initBgStars();
        drawBackground();
        blackHole.x = canvas.width / 2;
        blackHole.y = canvas.height / 2;
        drawBlackHole();
    </script>
</body>
</html>
