<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GRAVITY WELL - 引力井</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            cursor: none;
        }
        #gameCanvas {
            border: 4px solid #00f5ff;
            image-rendering: pixelated;
            box-shadow: 0 0 30px #00f5ff, inset 0 0 20px rgba(0, 245, 255, 0.1);
        }
        /* CRT Scanline Effect */
        #crtOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 3px
            );
        }
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 50%, #05050a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #startScreen h1 {
            font-size: 42px;
            color: #00f5ff;
            text-shadow: 0 0 10px #00f5ff, 0 0 20px #00f5ff, 0 0 40px #ff4da6;
            animation: neonPulse 1.5s infinite;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 6px;
        }
        #startScreen .subtitle {
            font-size: 18px;
            color: #ff4da6;
            text-shadow: 0 0 10px #ff4da6;
            margin-bottom: 40px;
            letter-spacing: 4px;
        }
        #startScreen .instructions {
            color: #fff;
            font-size: 14px;
            text-align: center;
            line-height: 2.2;
            max-width: 480px;
        }
        #startScreen .instructions .key {
            display: inline-block;
            padding: 3px 10px;
            border: 2px solid #ffff00;
            color: #ffff00;
            margin: 0 4px;
            box-shadow: 0 0 8px #ffff00;
        }
        #startScreen .click-hint {
            font-size: 22px;
            color: #ffff00;
            text-shadow: 0 0 10px #ffff00;
            animation: blink 1s infinite;
            margin-top: 40px;
        }
        @keyframes neonPulse {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 0 10px #00f5ff, 0 0 20px #00f5ff, 0 0 40px #ff4da6;
            }
            50% {
                transform: scale(1.02);
                text-shadow: 0 0 20px #00f5ff, 0 0 40px #00f5ff, 0 0 60px #ff4da6, 0 0 80px #ff4da6;
            }
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
        .pixel-border {
            padding: 25px 40px;
            border: 4px solid #ff4da6;
            box-shadow: 0 0 20px #ff4da6, inset 0 0 20px rgba(255, 77, 166, 0.1);
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border: 1px solid #fff;
        }
    </style>
</head>
<body>
    <div id="crtOverlay"></div>
    <div id="startScreen">
        <h1>GRAVITY WELL</h1>
        <div class="subtitle">- 引力井 -</div>
        <div class="pixel-border">
            <div class="instructions">
                <div style="color: #00f5ff; margin-bottom: 12px;">[ 引力操控游戏 ]</div>
                <div>移动鼠标控制引力源位置</div>
                <div>吸引漂浮的能量粒子得分</div>
                <div>躲避红色陨石 - 它们也会被引力吸引!</div>
                <br>
                <div style="color: #ffff00;">
                    多彩能量粒子: +10 ~ +30 分<br>
                    绿色护盾粒子: 恢复护盾<br>
                    陨石碰撞: -20 护盾
                </div>
                <div class="legend">
                    <div class="legend-item"><div class="legend-color" style="background: #00f5ff;"></div> 青色</div>
                    <div class="legend-item"><div class="legend-color" style="background: #ff4da6;"></div> 粉色</div>
                    <div class="legend-item"><div class="legend-color" style="background: #ffff00;"></div> 黄色</div>
                    <div class="legend-item"><div class="legend-color" style="background: #00ff88;"></div> 护盾</div>
                    <div class="legend-item"><div class="legend-color" style="background: #ff3333;"></div> 陨石</div>
                </div>
            </div>
        </div>
        <div class="click-hint">>>> 点击开始游戏 <<<</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // ==================== Constants ====================
        const COLORS = {
            bg1: '#0a0a0f',
            bg2: '#1a1a2e',
            cyan: '#00f5ff',
            magenta: '#ff4da6',
            yellow: '#ffff00',
            green: '#00ff88',
            white: '#ffffff',
            red: '#ff3333',
            orange: '#ff8833'
        };

        const PIXEL_SIZE = 4;
        const CANVAS_WIDTH = 900;
        const CANVAS_HEIGHT = 650;

        // ==================== Canvas Setup ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');

        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // ==================== Audio System ====================
        class AudioSystem {
            constructor() {
                this.ctx = null;
                this.enabled = false;
                this.masterGain = null;
                this.bgmPlaying = false;
                this.bgmTimeout = null;
                this.humOsc = null;
                this.humGain = null;
            }

            init() {
                if (this.ctx) return;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.35;
                this.masterGain.connect(this.ctx.destination);
                this.enabled = true;
            }

            playNote(freq, duration, type = 'square', volume = 0.25) {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            // Collect particle - rising 8bit arpeggio
            playCollect(colorType) {
                if (colorType === 'green') {
                    // Shield pickup - special sound
                    this.playNote(440, 0.08, 'square', 0.2);
                    setTimeout(() => this.playNote(660, 0.08, 'square', 0.18), 50);
                    setTimeout(() => this.playNote(880, 0.12, 'square', 0.15), 100);
                } else {
                    // Regular particle - quick rising tone
                    const baseFreq = colorType === 'cyan' ? 523 :
                                    colorType === 'magenta' ? 659 :
                                    colorType === 'yellow' ? 784 : 523;
                    this.playNote(baseFreq, 0.06, 'square', 0.15);
                    setTimeout(() => this.playNote(baseFreq * 1.5, 0.08, 'square', 0.12), 30);
                }
            }

            // Hit by meteor - low explosion
            playHit() {
                this.playNote(80, 0.3, 'sawtooth', 0.4);
                this.playNote(60, 0.35, 'square', 0.3);
                setTimeout(() => this.playNote(40, 0.2, 'sawtooth', 0.25), 100);
            }

            // Game over
            playGameOver() {
                const notes = [392, 349, 330, 294, 262, 220, 196, 165];
                notes.forEach((freq, i) => {
                    setTimeout(() => this.playNote(freq, 0.25, 'sawtooth', 0.2), i * 120);
                });
            }

            // Space ambient BGM
            startBGM() {
                if (!this.enabled || !this.ctx || this.bgmPlaying) return;
                this.bgmPlaying = true;
                this.playBGMLoop();
            }

            playBGMLoop() {
                if (!this.bgmPlaying) return;

                const now = this.ctx.currentTime;

                // Deep space drone - low frequency oscillation
                const drone = this.ctx.createOscillator();
                const droneGain = this.ctx.createGain();
                drone.type = 'sine';
                drone.frequency.setValueAtTime(55, now);
                drone.frequency.linearRampToValueAtTime(52, now + 2);
                drone.frequency.linearRampToValueAtTime(58, now + 4);
                drone.frequency.linearRampToValueAtTime(55, now + 6);
                droneGain.gain.setValueAtTime(0.06, now);
                drone.connect(droneGain);
                droneGain.connect(this.masterGain);
                drone.start(now);
                drone.stop(now + 6);

                // Ambient pad - soft chords
                const chords = [
                    [131, 165, 196],
                    [147, 175, 220],
                    [165, 196, 247],
                    [147, 175, 220]
                ];

                const chordIndex = Math.floor(Math.random() * chords.length);
                chords[chordIndex].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.02, now);
                    gain.gain.linearRampToValueAtTime(0.035, now + 2);
                    gain.gain.linearRampToValueAtTime(0.01, now + 5.5);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(now);
                    osc.stop(now + 6);
                });

                // Occasional bleep
                if (Math.random() > 0.5) {
                    setTimeout(() => {
                        const bleep = this.ctx.createOscillator();
                        const bleepGain = this.ctx.createGain();
                        bleep.type = 'sine';
                        bleep.frequency.value = 880 + Math.random() * 440;
                        bleepGain.gain.setValueAtTime(0.02, this.ctx.currentTime);
                        bleepGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                        bleep.connect(bleepGain);
                        bleepGain.connect(this.masterGain);
                        bleep.start();
                        bleep.stop(this.ctx.currentTime + 0.3);
                    }, Math.random() * 4000);
                }

                this.bgmTimeout = setTimeout(() => this.playBGMLoop(), 5500);
            }

            // Gravity hum - continuous while playing
            startGravityHum() {
                if (!this.enabled || !this.ctx || this.humOsc) return;

                this.humOsc = this.ctx.createOscillator();
                this.humGain = this.ctx.createGain();
                this.humOsc.type = 'sine';
                this.humOsc.frequency.value = 35;
                this.humGain.gain.value = 0.04;
                this.humOsc.connect(this.humGain);
                this.humGain.connect(this.masterGain);
                this.humOsc.start();
            }

            updateGravityHum(intensity) {
                if (!this.humGain) return;
                // Vary based on nearby objects
                this.humGain.gain.value = 0.02 + intensity * 0.06;
                if (this.humOsc) {
                    this.humOsc.frequency.value = 30 + intensity * 20;
                }
            }

            stopGravityHum() {
                if (this.humOsc) {
                    this.humOsc.stop();
                    this.humOsc = null;
                    this.humGain = null;
                }
            }

            stopBGM() {
                this.bgmPlaying = false;
                if (this.bgmTimeout) {
                    clearTimeout(this.bgmTimeout);
                    this.bgmTimeout = null;
                }
                this.stopGravityHum();
            }
        }

        // ==================== Pixel Drawing Functions ====================
        function drawPixel(ctx, x, y, color, size = PIXEL_SIZE) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x), Math.floor(y), size, size);
        }

        function drawPixelCircle(ctx, cx, cy, radius, color, alpha = 1, filled = false) {
            ctx.save();
            ctx.globalAlpha = alpha;
            const segments = Math.max(16, Math.floor(radius * 0.8));

            for (let i = 0; i < segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                const px = cx + Math.cos(angle) * radius;
                const py = cy + Math.sin(angle) * radius;
                ctx.fillStyle = color;
                ctx.fillRect(Math.floor(px) - PIXEL_SIZE/2, Math.floor(py) - PIXEL_SIZE/2, PIXEL_SIZE, PIXEL_SIZE);
            }

            if (filled && radius > PIXEL_SIZE * 2) {
                // Fill with smaller dots
                for (let r = radius - PIXEL_SIZE * 2; r > 0; r -= PIXEL_SIZE * 2) {
                    const innerSegments = Math.max(8, Math.floor(r * 0.5));
                    for (let i = 0; i < innerSegments; i++) {
                        const angle = (i / innerSegments) * Math.PI * 2;
                        const px = cx + Math.cos(angle) * r;
                        const py = cy + Math.sin(angle) * r;
                        ctx.fillStyle = color;
                        ctx.fillRect(Math.floor(px) - PIXEL_SIZE/2, Math.floor(py) - PIXEL_SIZE/2, PIXEL_SIZE, PIXEL_SIZE);
                    }
                }
            }

            ctx.restore();
        }

        // Draw gravity well (player)
        function drawGravityWell(ctx, x, y, pulse, power) {
            const baseSize = 12;
            const pulseAmount = Math.sin(pulse) * 3;

            // Outer gravity field rings
            for (let i = 5; i >= 1; i--) {
                const ringRadius = 25 + i * 20 + pulseAmount * (6 - i) * 0.5;
                const alpha = 0.08 + (6 - i) * 0.02;
                drawPixelCircle(ctx, x, y, ringRadius, COLORS.cyan, alpha * power);
            }

            // Inner glow layers
            const glowSize = baseSize + pulseAmount;

            // Cyan halo
            ctx.fillStyle = 'rgba(0, 245, 255, 0.3)';
            ctx.fillRect(x - glowSize * 2, y - glowSize * 2, glowSize * 4, glowSize * 4);

            ctx.fillStyle = 'rgba(0, 245, 255, 0.5)';
            ctx.fillRect(x - glowSize * 1.5, y - glowSize * 1.5, glowSize * 3, glowSize * 3);

            ctx.fillStyle = 'rgba(0, 245, 255, 0.7)';
            ctx.fillRect(x - glowSize, y - glowSize, glowSize * 2, glowSize * 2);

            // Black core (singularity)
            ctx.fillStyle = '#000000';
            ctx.fillRect(x - baseSize/2, y - baseSize/2, baseSize, baseSize);

            // Bright center
            ctx.fillStyle = 'rgba(0, 245, 255, 0.9)';
            ctx.fillRect(x - 2, y - 2, 4, 4);

            // Sparkles
            if (Math.random() > 0.6) {
                const sparkAngle = Math.random() * Math.PI * 2;
                const sparkDist = glowSize * 1.5 + Math.random() * glowSize;
                const sparkX = x + Math.cos(sparkAngle) * sparkDist;
                const sparkY = y + Math.sin(sparkAngle) * sparkDist;
                ctx.fillStyle = COLORS.cyan;
                ctx.fillRect(Math.floor(sparkX), Math.floor(sparkY), 2, 2);
            }
        }

        // Draw energy particle
        function drawEnergyParticle(ctx, p) {
            const size = p.size;
            ctx.globalAlpha = 1;

            // Glow
            ctx.fillStyle = p.glowColor;
            ctx.fillRect(Math.floor(p.x) - size, Math.floor(p.y) - size, size * 2, size * 2);

            // Core
            ctx.fillStyle = p.color;
            ctx.fillRect(Math.floor(p.x) - size/2, Math.floor(p.y) - size/2, size, size);

            // Sparkle
            ctx.fillStyle = COLORS.white;
            ctx.fillRect(Math.floor(p.x) - 1, Math.floor(p.y) - 1, 2, 2);

            ctx.globalAlpha = 1;
        }

        // Draw meteor
        function drawMeteor(ctx, m) {
            const size = m.size;

            // Trail
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = COLORS.red;
            for (let i = 0; i < 5; i++) {
                const trailX = m.x - m.vx * i * 3;
                const trailY = m.y - m.vy * i * 3;
                ctx.fillRect(Math.floor(trailX) - size/2 + i, Math.floor(trailY) - size/2 + i, size - i, size - i);
            }

            ctx.globalAlpha = 1;

            // Glow
            ctx.fillStyle = 'rgba(255, 51, 51, 0.4)';
            ctx.fillRect(Math.floor(m.x) - size, Math.floor(m.y) - size, size * 2, size * 2);

            // Core
            ctx.fillStyle = COLORS.red;
            ctx.fillRect(Math.floor(m.x) - size/2, Math.floor(m.y) - size/2, size, size);

            // Hot center
            ctx.fillStyle = COLORS.orange;
            ctx.fillRect(Math.floor(m.x) - size/4, Math.floor(m.y) - size/4, size/2, size/2);
        }

        // Draw background stars
        function drawBgStars(ctx, stars) {
            stars.forEach(star => {
                const twinkle = Math.sin(Date.now() / 500 + star.phase) * 0.3 + 0.7;
                ctx.fillStyle = star.color;
                ctx.globalAlpha = star.brightness * twinkle;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        // Draw trail particle
        function drawTrail(ctx, t) {
            ctx.globalAlpha = t.alpha;
            ctx.fillStyle = t.color;
            ctx.fillRect(Math.floor(t.x), Math.floor(t.y), t.size, t.size);
            ctx.globalAlpha = 1;
        }

        // Draw UI
        function drawUI(game) {
            // Score
            ctx.shadowColor = COLORS.cyan;
            ctx.shadowBlur = 10;
            ctx.fillStyle = COLORS.cyan;
            ctx.font = 'bold 24px "Courier New", monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${game.score}`, 20, 35);
            ctx.shadowBlur = 0;

            // Time
            ctx.fillStyle = COLORS.magenta;
            ctx.font = 'bold 18px "Courier New", monospace';
            ctx.fillText(`TIME: ${game.survivalTime.toFixed(1)}s`, 20, 60);

            // Shield bar
            const shieldBarWidth = 200;
            const shieldBarHeight = 16;
            const shieldX = 20;
            const shieldY = 75;

            // Background
            ctx.fillStyle = '#222';
            ctx.fillRect(shieldX, shieldY, shieldBarWidth, shieldBarHeight);

            // Shield fill
            const shieldWidth = (game.shield / game.maxShield) * shieldBarWidth;
            const shieldColor = game.shield > 60 ? COLORS.green :
                               game.shield > 30 ? COLORS.yellow : COLORS.red;
            ctx.fillStyle = shieldColor;
            ctx.fillRect(shieldX, shieldY, shieldWidth, shieldBarHeight);

            // Border
            ctx.strokeStyle = shieldColor;
            ctx.lineWidth = 2;
            ctx.strokeRect(shieldX, shieldY, shieldBarWidth, shieldBarHeight);

            // Glow
            ctx.shadowColor = shieldColor;
            ctx.shadowBlur = 8;
            ctx.strokeRect(shieldX, shieldY, shieldBarWidth, shieldBarHeight);
            ctx.shadowBlur = 0;

            // Label
            ctx.fillStyle = COLORS.white;
            ctx.font = '12px "Courier New", monospace';
            ctx.fillText('SHIELD', shieldX + shieldBarWidth + 10, shieldY + 12);

            // Particles collected
            ctx.fillStyle = COLORS.yellow;
            ctx.font = 'bold 16px "Courier New", monospace';
            ctx.fillText(`PARTICLES: ${game.particlesCollected}`, CANVAS_WIDTH - 180, 35);

            // Meteors destroyed/evaded
            ctx.fillStyle = COLORS.red;
            ctx.fillText(`DANGER: ${game.meteonsNear}`, CANVAS_WIDTH - 180, 58);
        }

        // ==================== Game State ====================
        const audio = new AudioSystem();

        let gameRunning = false;
        let score = 0;
        let survivalTime = 0;
        let shield = 100;
        const maxShield = 100;
        let particlesCollected = 0;
        let meteonsNear = 0;
        let lastTime = 0;

        // Player (gravity well)
        const player = {
            x: CANVAS_WIDTH / 2,
            y: CANVAS_HEIGHT / 2,
            pulse: 0,
            power: 1
        };

        // Mouse position
        let mouseX = CANVAS_WIDTH / 2;
        let mouseY = CANVAS_HEIGHT / 2;

        // Entities
        let particles = [];
        let meteors = [];
        let trails = [];
        let bgStars = [];

        // Spawn timers
        let particleSpawnTimer = 0;
        let meteorSpawnTimer = 0;

        // Gravity constants
        const GRAVITY_STRENGTH = 800;
        const GRAVITY_RANGE = 250;

        // ==================== Game Functions ====================
        function initBgStars() {
            bgStars = [];
            for (let i = 0; i < 120; i++) {
                bgStars.push({
                    x: Math.random() * CANVAS_WIDTH,
                    y: Math.random() * CANVAS_HEIGHT,
                    size: Math.random() < 0.3 ? 2 : 1,
                    brightness: Math.random() * 0.5 + 0.3,
                    phase: Math.random() * Math.PI * 2,
                    color: Math.random() < 0.2 ? COLORS.cyan :
                           Math.random() < 0.3 ? COLORS.magenta :
                           Math.random() < 0.4 ? COLORS.yellow : COLORS.white
                });
            }
        }

        function spawnParticle() {
            const types = [
                { color: COLORS.cyan, glow: 'rgba(0, 245, 255, 0.3)', points: 10 },
                { color: COLORS.magenta, glow: 'rgba(255, 77, 166, 0.3)', points: 20 },
                { color: COLORS.yellow, glow: 'rgba(255, 255, 0, 0.3)', points: 30 },
                { color: COLORS.green, glow: 'rgba(0, 255, 136, 0.3)', points: 0, isShield: true }
            ];

            const typeIndex = Math.random() < 0.15 ? 3 : Math.floor(Math.random() * 3);
            const type = types[typeIndex];

            // Spawn from edges
            let x, y, vx, vy;
            const edge = Math.floor(Math.random() * 4);
            const speed = 20 + Math.random() * 30;

            switch (edge) {
                case 0: // top
                    x = Math.random() * CANVAS_WIDTH;
                    y = -10;
                    vx = (Math.random() - 0.5) * speed;
                    vy = Math.random() * speed;
                    break;
                case 1: // right
                    x = CANVAS_WIDTH + 10;
                    y = Math.random() * CANVAS_HEIGHT;
                    vx = -Math.random() * speed;
                    vy = (Math.random() - 0.5) * speed;
                    break;
                case 2: // bottom
                    x = Math.random() * CANVAS_WIDTH;
                    y = CANVAS_HEIGHT + 10;
                    vx = (Math.random() - 0.5) * speed;
                    vy = -Math.random() * speed;
                    break;
                case 3: // left
                    x = -10;
                    y = Math.random() * CANVAS_HEIGHT;
                    vx = Math.random() * speed;
                    vy = (Math.random() - 0.5) * speed;
                    break;
            }

            particles.push({
                x, y, vx, vy,
                size: type.isShield ? 6 : 4 + Math.random() * 2,
                color: type.color,
                glowColor: type.glow,
                points: type.points,
                isShield: type.isShield || false,
                colorType: type.isShield ? 'green' :
                          type.color === COLORS.cyan ? 'cyan' :
                          type.color === COLORS.magenta ? 'magenta' : 'yellow'
            });
        }

        function spawnMeteor() {
            let x, y, vx, vy;
            const speed = 40 + Math.random() * 60 + survivalTime * 0.5;

            // Spawn from random edge, aimed somewhat toward center
            const edge = Math.floor(Math.random() * 4);

            switch (edge) {
                case 0: // top
                    x = Math.random() * CANVAS_WIDTH;
                    y = -20;
                    vx = (player.x - x) * 0.01 + (Math.random() - 0.5) * 50;
                    vy = speed;
                    break;
                case 1: // right
                    x = CANVAS_WIDTH + 20;
                    y = Math.random() * CANVAS_HEIGHT;
                    vx = -speed;
                    vy = (player.y - y) * 0.01 + (Math.random() - 0.5) * 50;
                    break;
                case 2: // bottom
                    x = Math.random() * CANVAS_WIDTH;
                    y = CANVAS_HEIGHT + 20;
                    vx = (player.x - x) * 0.01 + (Math.random() - 0.5) * 50;
                    vy = -speed;
                    break;
                case 3: // left
                    x = -20;
                    y = Math.random() * CANVAS_HEIGHT;
                    vx = speed;
                    vy = (player.y - y) * 0.01 + (Math.random() - 0.5) * 50;
                    break;
            }

            meteors.push({
                x, y, vx, vy,
                size: 10 + Math.random() * 6
            });
        }

        function createTrail(x, y, color, size) {
            trails.push({
                x, y,
                color,
                size: size || 2,
                alpha: 0.5,
                life: 0.3
            });
        }

        function update(dt) {
            survivalTime += dt;
            player.pulse += dt * 4;

            // Smooth mouse follow
            player.x += (mouseX - player.x) * 0.15;
            player.y += (mouseY - player.y) * 0.15;

            // Keep player in bounds
            player.x = Math.max(30, Math.min(CANVAS_WIDTH - 30, player.x));
            player.y = Math.max(30, Math.min(CANVAS_HEIGHT - 30, player.y));

            // Spawn particles
            particleSpawnTimer += dt;
            const particleInterval = Math.max(0.3, 1.2 - survivalTime * 0.01);
            if (particleSpawnTimer >= particleInterval) {
                spawnParticle();
                particleSpawnTimer = 0;
            }

            // Spawn meteors
            meteorSpawnTimer += dt;
            const meteorInterval = Math.max(0.8, 2.5 - survivalTime * 0.02);
            if (meteorSpawnTimer >= meteorInterval) {
                spawnMeteor();
                meteorSpawnTimer = 0;
            }

            // Count nearby objects for audio intensity
            let nearbyObjects = 0;

            // Update particles with gravity
            particles.forEach(p => {
                const dx = player.x - p.x;
                const dy = player.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < GRAVITY_RANGE && dist > 5) {
                    const force = GRAVITY_STRENGTH / (dist * dist) * dt;
                    p.vx += (dx / dist) * force;
                    p.vy += (dy / dist) * force;
                    nearbyObjects++;

                    // Create trail when being attracted
                    if (Math.random() > 0.5) {
                        createTrail(p.x, p.y, p.color, 2);
                    }
                }

                p.x += p.vx * dt;
                p.y += p.vy * dt;

                // Damping
                p.vx *= 0.998;
                p.vy *= 0.998;
            });

            // Update meteors with gravity
            meteors.forEach(m => {
                const dx = player.x - m.x;
                const dy = player.y - m.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < GRAVITY_RANGE * 1.5 && dist > 5) {
                    const force = GRAVITY_STRENGTH * 0.7 / (dist * dist) * dt;
                    m.vx += (dx / dist) * force;
                    m.vy += (dy / dist) * force;
                    nearbyObjects++;
                }

                m.x += m.vx * dt;
                m.y += m.vy * dt;

                // Trail
                if (Math.random() > 0.3) {
                    createTrail(m.x, m.y, COLORS.red, 3);
                }
            });

            // Update audio intensity
            audio.updateGravityHum(Math.min(nearbyObjects / 10, 1));
            meteonsNear = meteors.filter(m => {
                const dist = Math.sqrt((player.x - m.x) ** 2 + (player.y - m.y) ** 2);
                return dist < 150;
            }).length;

            // Check particle collection
            particles = particles.filter(p => {
                const dist = Math.sqrt((player.x - p.x) ** 2 + (player.y - p.y) ** 2);

                if (dist < 20) {
                    // Collected!
                    if (p.isShield) {
                        shield = Math.min(maxShield, shield + 25);
                        audio.playCollect('green');
                    } else {
                        score += p.points;
                        particlesCollected++;
                        audio.playCollect(p.colorType);
                    }

                    // Burst effect
                    for (let i = 0; i < 8; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        createTrail(
                            p.x + Math.cos(angle) * 5,
                            p.y + Math.sin(angle) * 5,
                            p.color, 3
                        );
                    }

                    return false;
                }

                // Remove if off screen
                if (p.x < -50 || p.x > CANVAS_WIDTH + 50 ||
                    p.y < -50 || p.y > CANVAS_HEIGHT + 50) {
                    return false;
                }

                return true;
            });

            // Check meteor collision
            meteors = meteors.filter(m => {
                const dist = Math.sqrt((player.x - m.x) ** 2 + (player.y - m.y) ** 2);

                if (dist < m.size + 10) {
                    // Hit!
                    shield -= 20;
                    audio.playHit();

                    // Burst effect
                    for (let i = 0; i < 15; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        createTrail(
                            m.x + Math.cos(angle) * 8,
                            m.y + Math.sin(angle) * 8,
                            COLORS.red, 4
                        );
                    }

                    if (shield <= 0) {
                        gameOver();
                    }

                    return false;
                }

                // Remove if off screen (far)
                if (m.x < -100 || m.x > CANVAS_WIDTH + 100 ||
                    m.y < -100 || m.y > CANVAS_HEIGHT + 100) {
                    return false;
                }

                return true;
            });

            // Update trails
            trails.forEach(t => {
                t.life -= dt * 2;
                t.alpha = t.life * 0.5;
                t.size *= 0.95;
            });
            trails = trails.filter(t => t.life > 0);
        }

        function render() {
            // Clear with gradient background
            const gradient = ctx.createRadialGradient(
                player.x, player.y, 0,
                player.x, player.y, CANVAS_WIDTH
            );
            gradient.addColorStop(0, '#0f0f1a');
            gradient.addColorStop(0.3, COLORS.bg1);
            gradient.addColorStop(1, '#050508');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Draw background stars
            drawBgStars(ctx, bgStars);

            // Draw trails
            trails.forEach(t => drawTrail(ctx, t));

            // Draw particles
            particles.forEach(p => drawEnergyParticle(ctx, p));

            // Draw meteors
            meteors.forEach(m => drawMeteor(ctx, m));

            // Draw gravity well (player)
            drawGravityWell(ctx, Math.floor(player.x), Math.floor(player.y), player.pulse, player.power);

            // Draw UI
            drawUI({
                score,
                survivalTime,
                shield,
                maxShield,
                particlesCollected,
                meteonsNear
            });

            // Game over screen
            if (!gameRunning && shield <= 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                const glitchOffset = Math.sin(Date.now() / 50) * 3;

                ctx.shadowColor = COLORS.red;
                ctx.shadowBlur = 20;
                ctx.fillStyle = COLORS.red;
                ctx.font = 'bold 52px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', CANVAS_WIDTH / 2 + glitchOffset, CANVAS_HEIGHT / 2 - 80);

                ctx.shadowColor = COLORS.cyan;
                ctx.fillStyle = COLORS.cyan;
                ctx.font = 'bold 28px "Courier New", monospace';
                ctx.fillText(`SCORE: ${score}`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 10);

                ctx.shadowBlur = 0;
                ctx.fillStyle = COLORS.magenta;
                ctx.font = '22px "Courier New", monospace';
                ctx.fillText(`SURVIVED: ${survivalTime.toFixed(1)}s`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 30);

                ctx.fillStyle = COLORS.yellow;
                ctx.fillText(`PARTICLES: ${particlesCollected}`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 60);

                ctx.fillStyle = COLORS.white;
                ctx.font = '18px "Courier New", monospace';
                ctx.fillText('Click to restart', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 120);
            }
        }

        function gameLoop(timestamp) {
            if (!gameRunning) return;

            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            audio.init();
            audio.startBGM();
            audio.startGravityHum();
            startScreen.style.display = 'none';
            gameRunning = true;

            // Reset state
            score = 0;
            survivalTime = 0;
            shield = 100;
            particlesCollected = 0;
            meteonsNear = 0;
            particles = [];
            meteors = [];
            trails = [];
            particleSpawnTimer = 0;
            meteorSpawnTimer = 0;
            player.x = CANVAS_WIDTH / 2;
            player.y = CANVAS_HEIGHT / 2;
            mouseX = CANVAS_WIDTH / 2;
            mouseY = CANVAS_HEIGHT / 2;

            initBgStars();

            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameRunning = false;
            audio.stopBGM();
            audio.playGameOver();
        }

        function resetGame() {
            audio.startBGM();
            audio.startGravityHum();
            gameRunning = true;

            score = 0;
            survivalTime = 0;
            shield = 100;
            particlesCollected = 0;
            meteonsNear = 0;
            particles = [];
            meteors = [];
            trails = [];
            particleSpawnTimer = 0;
            meteorSpawnTimer = 0;
            player.x = CANVAS_WIDTH / 2;
            player.y = CANVAS_HEIGHT / 2;
            mouseX = CANVAS_WIDTH / 2;
            mouseY = CANVAS_HEIGHT / 2;

            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        // ==================== Event Listeners ====================
        startScreen.addEventListener('click', () => {
            if (!gameRunning) startGame();
        });

        canvas.addEventListener('click', () => {
            if (!gameRunning && shield <= 0) {
                resetGame();
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = (touch.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (touch.clientY - rect.top) * (canvas.height / rect.height);
        }, { passive: false });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!gameRunning && shield <= 0) {
                resetGame();
            }
        });

        // Initialize
        initBgStars();
    </script>
</body>
</html>
